<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Timer</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/KxRJyWnp/st-photo-png.png">
    
    <style id="dynamicStyle">
        :root {
            --study-color: #a6e3a1;
            --break-color: #cba6f7;
            --social-color: #89b4fa;
            --afk-color: #f9e2af;
            --clock-color: #a6adc8; 
            --current-theme: var(--study-color);
        }

        body { 
            background: #0f0f16; 
            color: var(--current-theme); 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            transition: background 0.5s, color 0.5s;
        }

        .cairo-live-widget {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #181825;
            border: 1px solid #313244;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #6c7086; 
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: left;
        }
        .cairo-live-widget .widget-clock {
            color: var(--clock-color);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            direction: rtl;
        }

        .brand-title { font-size: 2.5rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 30px; color: var(--current-theme); }
        .footer-credits { position: absolute; bottom: 25px; font-size: 0.85rem; color: #585b70; letter-spacing: 0.5px; }

        #mainContainer { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; transition: padding-right 0.3s ease; }
        #mainContainer.sidebar-open { padding-right: 380px; }
        #mainApp { text-align: center; width: 100%; max-width: 600px; }
        .timer-box { display: none; }
        .timer-box.active { display: block; }
        .timer-display { font-size: 6rem; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,255,0.1); margin-bottom: 10px; }
        
        .break-input-group { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .break-input-group .input-field { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .break-input-group label { font-size: 0.85rem; opacity: 0.8; color: #cdd6f4;}
        .break-input-group input { background: #181825; border: 1px solid #313244; padding: 8px 12px; border-radius: 8px; color: #cdd6f4; width: 60px; text-align: center; font-size: 1rem; }

        .top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
        .top-bar button { background: #1e1e2e; border: 1px solid #313244; color: #cdd6f4; padding: 8px 16px; font-size: 0.85rem; }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        button { padding: 12px 25px; cursor: pointer; border-radius: 25px; border: 1px solid var(--current-theme); background: #1e1e2e; color: var(--current-theme); font-weight: bold; transition: 0.3s; font-family: inherit; }
        button:hover { background: var(--current-theme); color: #11111b; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .mode-btn { background: #11111b; font-size: 0.9rem; }
        #btn-study { border-color: var(--study-color); color: var(--study-color); }
        #btn-break { border-color: var(--break-color); color: var(--break-color); }
        #btn-social { border-color: var(--social-color); color: var(--social-color); }
        #btn-afk { border-color: var(--afk-color); color: var(--afk-color); }

        .sidebar { position: fixed; right: -400px; top: 0; width: 360px; height: 100%; background: #11111b; border-left: 2px solid var(--current-theme); box-shadow: -5px 0 25px rgba(0,0,0,0.5); transition: right 0.3s ease; z-index: 100; display: flex; flex-direction: column; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--current-theme); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-header-share { background: #313244; border: 1px solid var(--current-theme); color: #fff; padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; }
        .btn-header-share:hover { background: var(--current-theme); color: #11111b; }
        .close-sidebar-btn { background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; }

        .sidebar-content { padding: 12px; flex-grow: 1; overflow-y: scroll; }
        .sidebar-content::-webkit-scrollbar { width: 14px; }
        .sidebar-content::-webkit-scrollbar-track { background: #181825; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--current-theme); border-radius: 7px; border: 2px solid #11111b; }

        .history-card { background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 10px; margin-bottom: 8px; color: #cdd6f4; font-size: 0.85rem; }
        .card-main-line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222538; padding-bottom: 4px; margin-bottom: 4px; }
        .card-subject { font-weight: bold; color: #fff; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
        .card-duration { font-weight: bold; color: var(--current-theme); }
        .card-desc { color: #a6adc8; font-size: 0.8rem; margin: 4px 0; background: #11111b; padding: 4px 6px; border-radius: 4px; text-align: right; direction: rtl; word-wrap: break-word; }
        
        .card-time-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 5px; font-family: inherit; direction: rtl; gap: 5px; }
        .time-tag { padding: 2px 5px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
        .time-tag.start { background: rgba(166, 227, 161, 0.1); color: #a6e3a1; }
        .time-tag.end { background: rgba(243, 139, 168, 0.1); color: #f38ba8; }
        
        .card-bottom-info { font-size: 0.75rem; color: #7f849c; display: flex; justify-content: space-between; margin-top: 6px; }
        .card-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; align-items: center;}
        .card-actions button { padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; border: 1px solid #313244; background: none;}
        .btn-edit { color: #f9e2af; border-color: #f9e2af !important; }
        .btn-delete { color: #f38ba8; border-color: #f38ba8 !important; }
        .btn-recovery { color: #a6e3a1; border-color: #a6e3a1 !important; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e2e; border: 2px solid var(--current-theme); padding: 20px; border-radius: 12px; width: 320px; text-align: right; direction: rtl; color: #cdd6f4; }
        .modal-content h3 { margin-top: 0; color: var(--current-theme); text-align: center; font-size: 1.1rem;}
        .modal-content label { display: block; margin: 8px 0 4px; font-size: 0.85rem;}
        .modal-content input, .modal-content textarea { width: 100%; padding: 8px; background: #11111b; border: 1px solid #313244; border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; font-family: inherit;}
        .modal-content textarea { resize: none; height: 60px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; justify-content: center;}
        .modal-actions button { padding: 6px 16px; font-size: 0.85rem;}

        @media print {
            body * { visibility: hidden; background: white !important; color: black !important; }
            #sidebarHistory, #sidebarHistory * { visibility: visible; }
            #sidebarHistory { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
            .close-sidebar-btn, .btn-header-share, .card-actions, .cairo-live-widget { display: none !important; }
            .history-card { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; page-break-inside: avoid; margin-bottom: 15px; }
            .card-subject, .card-duration, .card-desc { color: #000 !important; background: #fff !important; }
            .time-tag.start, .time-tag.end { background: none !important; border: 1px solid #000; color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="cairo-live-widget">
        <div id="cairoClock" class="widget-clock">جاري تحميل التوقيت...</div>
        <div id="cairoDate">جاري تحميل التاريخ...</div>
    </div>

    <div class="top-bar">
        <button onclick="openHistory('study')">Study History 📚</button>
        <button onclick="openHistory('break')">Break History ☕</button>
        <button onclick="openHistory('social')">Social History 📱</button>
        <button onclick="openHistory('afk')">AFK History ⏳</button>
        <button style="border-color:#f38ba8; color:#f38ba8;" onclick="openHistory('trash')">Trash / Recovery 🗑️</button>
    </div>

    <div id="mainContainer">
        <div id="appTitle" class="brand-title">Study Timer</div>

        <div id="mainApp">
            <div id="container-study" class="timer-box active">
                <div id="display-study" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini('display-study')">Mini</button>
                </div>
            </div>

            <div id="container-break" class="timer-box">
                <div id="display-break" class="timer-display">05:00</div>
                <div class="break-input-group">
                    <div class="input-field"><label>Hours</label><input type="number" id="breakHoursInput" value="0" min="0" max="24" onchange="setBreakDuration()"></div>
                    <div class="input-field"><label>Minutes</label><input type="number" id="breakMinutesInput" value="5" min="0" max="59" onchange="setBreakDuration()"></div>
                </div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini('display-break')">Mini</button>
                </div>
            </div>

            <div id="container-social" class="timer-box">
                <div id="display-social" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini('display-social')">Mini</button>
                </div>
            </div>

            <div id="container-afk" class="timer-box">
                <div id="display-afk" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini('display-afk')">Mini</button>
                </div>
            </div>

            <div class="controls" style="margin-top: 35px; border-top: 1px solid #181825; padding-top: 20px;">
                <button id="btn-study" class="mode-btn" onclick="switchMode('study')">Study Mode 📚</button>
                <button id="btn-break" class="mode-btn" onclick="switchMode('break')">Break Mode ☕</button>
                <button id="btn-social" class="mode-btn" onclick="switchMode('social')">Social Timer 📱</button>
                <button id="btn-afk" class="mode-btn" onclick="switchMode('afk')">AFK Timer ⏳</button>
            </div>
        </div>
    </div>

    <div id="sidebarHistory" class="sidebar">
        <div class="sidebar-header">
            <button class="close-sidebar-btn" onclick="closeHistory()">✕</button>
            <div class="header-actions">
                <button id="printHistoryBtn" class="btn-header-share" onclick="printFullHistory()">Share PDF 📄</button>
                <h2 id="sidebarTitle">Study History</h2>
            </div>
        </div>
        <div id="sidebarContent" class="sidebar-content"></div>
    </div>

    <div id="saveModal" class="modal">
        <div class="modal-content">
            <h3 id="modalHeaderTitle">حفظ السجل الجديد</h3>
            <label>اسم المادة / النشاط:</label>
            <input type="text" id="modalSubjectInput" placeholder="مثال: لغة عربية (بلاغة)...">
            <label>وصف المذاكرة (كتبت وذاكرت إيه فيها؟):</label>
            <textarea id="modalDescInput" placeholder="اكتب تفاصيل ما تم إنجازه هنا..."></textarea>
            <div class="modal-actions">
                <button onclick="confirmSaveSession()">حفظ السجل</button>
                <button style="color:#f38ba8; border-color:#f38ba8;" onclick="closeModal('saveModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل بيانات السجل</h3>
            <label>اسم المادة / النشاط:</label>
            <input type="text" id="editSubjectInput">
            <label>وصف النشاط:</label>
            <textarea id="editDescInput"></textarea>
            <label>اليوم:</label>
            <input type="text" id="editDayInput">
            <label>التاريخ:</label>
            <input type="text" id="editDateInput">
            <div class="modal-actions">
                <button onclick="confirmEditSession()">تحديث</button>
                <button style="color:#f38ba8; border-color:#f38ba8;" onclick="closeModal('editModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="footer-credits">© 2026 Amr Abdelhalim . All Rights Reserved</div>

    <canvas id="videoCanvas" width="360" height="150" style="display:none;"></canvas>
    <video id="pipVideo" width="360" height="150" autoplay muted loop style="display:none;"></video>

    <script>
        let timers = {
            study: { seconds: parseInt(localStorage.getItem('savedStudySeconds')) || 0, type: 'up', id: null },
            break: { seconds: 300, type: 'down', id: null },
            social: { seconds: 0, type: 'up', id: null },
            afk: { seconds: 0, type: 'up', id: null }
        };

        let currentActiveMode = 'study';
        let sessionStartTime = null; 
        
        let currentCairoGlobalDateObject = null; 

        let historyData = JSON.parse(localStorage.getItem('timerHistoryData')) || { study: [], break: [], social: [], afk: [], trash: [] };
        if(!historyData.trash) historyData.trash = []; 
        
        let activeHistoryView = 'study'; 
        let currentEditingIndex = null;

        const MY_AUDIO_URL = "https://files.catbox.moe/d5k1bg.mp3"; 
        let customAudio = new Audio(MY_AUDIO_URL);
        let audioStopTimeout = null;

        window.onload = function() {
            updateDisplay('study');
            setBreakDuration();
            setupPipStream();
            updateThemeColors();
            fetchCairoGlobalTime(); 
        }

        async function fetchCairoGlobalTime() {
            try {
                let response = await fetch('https://worldtimeapi.org/api/timezone/Africa/Cairo');
                if (response.ok) {
                    let data = await response.json();
                    currentCairoGlobalDateObject = new Date(data.datetime);
                } else {
                    currentCairoGlobalDateObject = new Date();
                }
            } catch (error) {
                currentCairoGlobalDateObject = new Date();
            }
            startCairoLiveClockAndEngine(); 
        }

        function getCairoPrayerPeriodInfo(dateObj) {
            if (!dateObj) return { textTime: "--:--", periodName: "" };

            let hours = dateObj.getHours();
            let minutes = dateObj.getMinutes();
            let totalMinutes = (hours * 60) + minutes;

            const fajr = (4 * 60) + 15;      
            const shrooq = (6 * 60) + 0;     
            const dhuhr = (13 * 60) + 0;     
            const asr = (16 * 60) + 30;      
            const maghrib = (20 * 60) + 0;   
            const isha = (21 * 60) + 30;     
            const midnight = (24 * 60);      

            let periodName = "";
            if (totalMinutes >= fajr && totalMinutes < shrooq) {
                periodName = "فجراً";
            } else if (totalMinutes >= shrooq && totalMinutes < dhuhr) {
                periodName = "شروق";
            } else if (totalMinutes >= dhuhr && totalMinutes < asr) {
                periodName = "ظهراً";
            } else if (totalMinutes >= asr && totalMinutes < maghrib) {
                periodName = "عصراً";
            } else if (totalMinutes >= maghrib && totalMinutes < isha) {
                periodName = "المغرب";
            } else if (totalMinutes >= isha && totalMinutes < midnight) {
                periodName = "العشاء";
            } else {
                periodName = "الليل"; 
            }

            let displayHours = hours;
            if (displayHours > 12) displayHours -= 12;
            if (displayHours === 0) displayHours = 12;

            let displayMinutes = minutes === 0 ? "" : ":" + minutes.toString().padStart(2, '0');
            return `${displayHours}${displayMinutes} ${periodName}`;
        }

        function startCairoLiveClockAndEngine() {
            // تحويل مصفوفة الأيام بالكامل إلى لغتنا العربية الفصيحة والمألوفة
            const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            
            setInterval(() => {
                if (currentCairoGlobalDateObject) {
                    currentCairoGlobalDateObject.setSeconds(currentCairoGlobalDateObject.getSeconds() + 1);
                    
                    let prayerFormattedTime = getCairoPrayerPeriodInfo(currentCairoGlobalDateObject);
                    let cairoDateParts = currentCairoGlobalDateObject.toLocaleDateString('en-US', { day: '2-digit', month: '2-digit', year: 'numeric' }).split('/');
                    let cairoDayName = daysArr[currentCairoGlobalDateObject.getDay()];
                    
                    document.getElementById('cairoClock').innerText = prayerFormattedTime;
                    document.getElementById('cairoDate').innerText = `${cairoDayName}، ${cairoDateParts[1]}/${cairoDateParts[0]}/${cairoDateParts[2]}`;
                }
            }, 1000);
        }

        function getCairoTimeSnapshotString() {
            return getCairoPrayerPeriodInfo(currentCairoGlobalDateObject);
        }

        function getCairoDateSnapshotInfo() {
            let days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            if (!currentCairoGlobalDateObject) {
                let d = new Date();
                return { day: days[d.getDay()], date: d.toLocaleDateString('en-US') };
            }
            let dayName = days[currentCairoGlobalDateObject.getDay()];
            let dateParts = currentCairoGlobalDateObject.toLocaleDateString('en-US', { day: '2-digit', month: '2-digit', year: 'numeric' }).split('/');
            return { day: dayName, date: `${dateParts[1]}/${dateParts[0]}/${dateParts[2]}` };
        }

        function setupPipStream() {
            const canvas = document.getElementById('videoCanvas');
            const video = document.getElementById('pipVideo');
            const stream = canvas.captureStream(10);
            video.srcObject = stream;
        }

        function updateThemeColors() {
            const root = document.documentElement;
            if(currentActiveMode === 'study') root.style.setProperty('--current-theme', 'var(--study-color)');
            if(currentActiveMode === 'break') root.style.setProperty('--current-theme', 'var(--break-color)');
            if(currentActiveMode === 'social') root.style.setProperty('--current-theme', 'var(--social-color)');
            if(currentActiveMode === 'afk') root.style.setProperty('--current-theme', 'var(--afk-color)');
        }

        function switchMode(mode) {
            pauseTimer();
            document.getElementById(`container-${currentActiveMode}`).classList.remove('active');
            currentActiveMode = mode;
            document.getElementById(`container-${currentActiveMode}`).classList.add('active');
            updateThemeColors();
            updateDisplay(currentActiveMode);
            stopAlarm();
            if(document.pictureInPictureElement) updatePipCanvas(`display-${currentActiveMode}`);
        }

        function formatDynamicTime(totalSeconds) {
            let hours = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = totalSeconds % 60;
            return hours > 0 ? `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}` : `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay(mode) {
            let timeStr = formatDynamicTime(timers[mode].seconds);
            document.getElementById(`display-${mode}`).innerText = timeStr;
            if(mode === 'study') localStorage.setItem('savedStudySeconds', timers.study.seconds);
        }

        function startTimer() {
            let t = timers[currentActiveMode];
            if(!sessionStartTime || timers[currentActiveMode].seconds === 0) {
                sessionStartTime = getCairoTimeSnapshotString();
            }
            if(!t.id) {
                t.id = setInterval(() => {
                    if(t.type === 'up') {
                        t.seconds++;
                        updateDisplay(currentActiveMode);
                        if(currentActiveMode === 'study' && t.seconds > 0 && t.seconds % 3600 === 0) playAlarm("عاش يا بطل! كملت ساعة كاملة مذاكرة بنجاح.. استمر! 🎯");
                    } else {
                        if(t.seconds > 0) {
                            t.seconds--;
                            updateDisplay(currentActiveMode);
                        } else {
                            pauseTimer();
                            playAlarm(currentActiveMode === 'break' ? "وقت الاستراحة انتهى! حان وقت العودة للجد وعمرو مستنيك! 📚" : "انتهى الوقت!");
                        }
                    }
                    if(document.pictureInPictureElement) updatePipCanvas(`display-${currentActiveMode}`);
                }, 1000);
            }
        }

        function pauseTimer() { let t = timers[currentActiveMode]; clearInterval(t.id); t.id = null; }
        function endTimer() { pauseTimer(); sessionStartTime = null; if(timers[currentActiveMode].type === 'up') timers[currentActiveMode].seconds = 0; else setBreakDuration(); updateDisplay(currentActiveMode); if(document.pictureInPictureElement) updatePipCanvas(`display-${currentActiveMode}`); }
        function setBreakDuration() { const hoursInput = parseInt(document.getElementById('breakHoursInput').value) || 0; const minsInput = parseInt(document.getElementById('breakMinutesInput').value) || 0; timers.break.seconds = (hoursInput * 3600) + (minsInput * 60); updateDisplay('break'); }

        function saveSessionPrompt() {
            pauseTimer();
            if(timers[currentActiveMode].seconds === 0) { alert("المؤقت فارغ! لا يمكن حفظ سجل بدون وقت."); return; }
            document.getElementById('modalSubjectInput').value = "";
            document.getElementById('modalDescInput').value = "";
            document.getElementById('saveModal').style.display = 'flex';
        }

        function confirmSaveSession() {
            let subjectInput = document.getElementById('modalSubjectInput').value.trim() || "نشاط غير مسمى";
            let descInput = document.getElementById('modalDescInput').value.trim() || "لم يتم إضافة تفاصيل وصفية لهذه الجلسة.";
            
            let endTime = getCairoTimeSnapshotString();
            let dateInfo = getCairoDateSnapshotInfo();

            let newRecord = {
                id: Date.now(),
                originMode: currentActiveMode, 
                subject: subjectInput,
                desc: descInput,
                duration: formatDynamicTime(timers[currentActiveMode].seconds),
                date: dateInfo.date,
                day: dateInfo.day, // سيحفظ اليوم بالعربي هنا تلقائياً
                startTime: sessionStartTime || getCairoTimeSnapshotString(), 
                endTime: endTime
            };

            historyData[currentActiveMode].unshift(newRecord);
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            document.getElementById('saveModal').style.display = 'none';
            alert("تم حفظ الجلسة بنظام التوقيت الإسلامي لجمهورية مصر العربية! 🌍");
            endTimer();
        }

        function openHistory(type) {
            activeHistoryView = type;
            const sidebar = document.getElementById('sidebarHistory');
            const title = document.getElementById('sidebarTitle');
            const mainCont = document.getElementById('mainContainer');
            const printBtn = document.getElementById('printHistoryBtn');

            let typeNames = { study: 'Study History 📚', break: 'Break History ☕', social: 'Social History 📱', afk: 'AFK History ⏳', trash: 'Trash / Recovery 🗑️' };
            title.innerText = typeNames[type];

            printBtn.style.display = (type === 'trash') ? 'none' : 'block';

            renderHistoryCards();
            sidebar.classList.add('open');
            mainCont.classList.add('sidebar-open');
        }

        function closeHistory() { document.getElementById('sidebarHistory').classList.remove('open'); document.getElementById('mainContainer').classList.remove('sidebar-open'); }

        function renderHistoryCards() {
            const container = document.getElementById('sidebarContent');
            container.innerHTML = "";
            let list = historyData[activeHistoryView];

            if(list.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#585b70; margin-top:40px;">لا توجد سجلات محفوظة هنا حالياً.</p>`;
                return;
            }

            list.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = 'history-card';
                
                card.innerHTML = `
                    <div class="card-main-line">
                        <div class="card-subject">${item.subject}</div>
                        <div class="card-duration">${item.duration}</div>
                    </div>
                    <div class="card-desc">${item.desc}</div>
                    <div class="card-time-row">
                        <span class="time-tag start">البداية: ${item.startTime}</span>
                        <span class="time-tag end">النهاية: ${item.endTime}</span>
                    </div>
                    <div class="card-bottom-info">
                        <span>${item.day}</span>
                        <span>${item.date}</span>
                    </div>
                    <div class="card-actions">
                        ${activeHistoryView === 'trash' ? 
                            `<button class="btn-recovery" onclick="recoverRecord(${index})">Recovery ↩️</button>
                             <button class="btn-delete" style="color:#f38ba8;" onclick="hardDeleteRecord(${index})">حذف نهائي ❌</button>` :
                            `<button class="btn-edit" onclick="openEditModal(${index})">Edit ✏️</button>
                             <button class="btn-delete" onclick="deleteRecord(${index})">Delete 🗑️</button>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteRecord(index) {
            let record = historyData[activeHistoryView][index];
            historyData.trash.unshift(record);
            historyData[activeHistoryView].splice(index, 1);
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            renderHistoryCards();
        }

        function recoverRecord(index) {
            let record = historyData.trash[index];
            let targetMode = record.originMode || 'study';
            historyData[targetMode].unshift(record);
            historyData.trash.splice(index, 1);
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            renderHistoryCards();
            alert("تم استرجاع السجل وإعادته لقائمته الأصلية بنجاح! ↩️");
        }

        function hardDeleteRecord(index) {
            if(confirm("هل تريد حذف هذا السجل من المهملات بشكل نهائي تماماً؟ لا يمكن استرجاعه مرة أخرى.")) {
                historyData.trash.splice(index, 1);
                localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
                renderHistoryCards();
            }
        }

        function openEditModal(index) {
            currentEditingIndex = index;
            let record = historyData[activeHistoryView][index];
            document.getElementById('editSubjectInput').value = record.subject;
            document.getElementById('editDescInput').value = record.desc || "";
            document.getElementById('editDayInput').value = record.day;
            document.getElementById('editDateInput').value = record.date;
            document.getElementById('editModal').style.display = 'flex';
        }

        function confirmEditSession() {
            let record = historyData[activeHistoryView][currentEditingIndex];
            record.subject = document.getElementById('editSubjectInput').value.trim() || record.subject;
            record.desc = document.getElementById('editDescInput').value.trim() || record.desc;
            record.day = document.getElementById('editDayInput').value.trim() || record.day;
            record.date = document.getElementById('editDateInput').value.trim() || record.date;

            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            document.getElementById('editModal').style.display = 'none';
            renderHistoryCards();
            alert("تم التعديل بنجاح!");
        }

        function printFullHistory() { window.print(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function playAlarm(notificationText) {
            if(audioStopTimeout) clearTimeout(audioStopTimeout);
            customAudio.pause(); customAudio.currentTime = 0;
            customAudio.play().catch(e => console.log(e));
            audioStopTimeout = setTimeout(() => { stopAlarm(); }, 12000);
            if (Notification.permission === "granted") {
                new Notification("Study Timer", { body: notificationText });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => { if (permission === "granted") new Notification("Study Timer", { body: notificationText }); });
            }
        }

        function stopAlarm() { if(audioStopTimeout) clearTimeout(audioStopTimeout); customAudio.pause(); customAudio.currentTime = 0; }

        function updatePipCanvas(targetDisplayId) {
            const canvas = document.getElementById('videoCanvas'); const ctx = canvas.getContext('2d');
            let textColor = "#a6e3a1";
            if(currentActiveMode === 'break') textColor = "#cba6f7";
            if(currentActiveMode === 'social') textColor = "#89b4fa";
            if(currentActiveMode === 'afk') textColor = "#f9e2af";
            const textText = document.getElementById(targetDisplayId).innerText;
            ctx.fillStyle = "#0f0f16"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = textColor; ctx.font = textText.length > 5 ? "bold 42px Courier New" : "bold 55px Courier New";
            ctx.textAlign = "center"; ctx.fillText(textText, canvas.width/2, 90);
        }

        async function requestMini(targetDisplayId) {
            const video = document.getElementById('pipVideo');
            try {
                updatePipCanvas(targetDisplayId);
                if (document.pictureInPictureElement) { await document.exitPictureInPicture(); } 
                else {
                    await video.play(); await video.requestPictureInPicture();
                    setInterval(() => { if(document.pictureInPictureElement) updatePipCanvas(`display-${currentActiveMode}`); }, 500);
                }
            } catch (error) { alert("تأكد من الضغط على زر Start أولاً لتفعيل الواجهة قبل تشغيل الـ Mini!"); }
        }
    </script>
</body>
</html>
