<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study System</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/KxRJyWnp/st-photo-png.png">
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #070a13;
            --bg-side: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-sub: #64748b;
            
            --primary-accent: #6366f1;
            
            --color-study: #10b981;
            --color-listening: #3b82f6;
            --color-writing: #f59e0b;
            --color-quiz: #ec4899;
            --color-afk: #eab308;
            --color-break: #ef4444;
            --color-danger: #ef4444;

            /* Subject Colors */
            --color-arabic: #10b981;
            --color-english: #3b82f6;
            --color-history: #f59e0b;
            --color-physics: #8b5cf6;

            --sidebar-width: 270px;
            --sidebar-collapsed: 80px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .layout-wrapper {
            display: flex;
            flex: 1;
            width: 100%;
        }

        /* Sidebar Navigation */
        aside.sidebar {
            width: var(--sidebar-width);
            background: var(--bg-side);
            border-left: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
            flex-shrink: 0;
            transition: var(--transition);
        }

        aside.sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            padding: 22px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .toggle-btn:hover {
            background: var(--primary-accent);
            color: #fff;
        }

        .nav-group {
            padding: 15px 10px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-group-title {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-weight: 800;
            padding: 12px 12px 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .sidebar.collapsed .nav-group-title,
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .profile-info {
            display: none;
        }

        .nav-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            margin-bottom: 5px;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary-accent), #4f46e5);
            color: #fff;
        }

        .nav-btn .icon {
            font-size: 1.15rem;
            width: 26px;
            text-align: center;
        }

        /* User Profile Box */
        .user-profile {
            padding: 16px;
            border-top: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.25);
        }

        .profile-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
        }

        /* Main Area */
        main.main-content {
            flex-grow: 1;
            padding: 28px;
            overflow-y: auto;
            max-width: 1400px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-title {
            font-size: 1.25rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
        }

        /* Timers */
        .timer-header-label {
            font-size: 1.35rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .mode-study { color: #10b981 !important; }
        .mode-break { color: #ef4444 !important; }
        .mode-afk { color: #eab308 !important; }

        .main-timer-display {
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            font-family: 'Plus Jakarta Sans', monospace;
            margin: 10px 0 20px 0;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn-action {
            padding: 10px 22px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-success { background: var(--color-study); color: #fff; border: none; }
        .btn-success:hover { background: #059669; }
        
        .btn-danger { background: var(--color-danger); color: #fff; border: none; }
        .btn-danger:hover { background: #dc2626; }

        .btn-sm-timer {
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--card-border);
            color: #fff;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-sm-timer:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        /* Sub Timers Grid */
        .sub-timers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            margin-top: 25px;
        }

        .sub-timer-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sub-timer-display {
            font-size: 2.1rem;
            font-family: 'Plus Jakarta Sans', monospace;
            font-weight: 800;
            margin: 12px 0;
        }

        .sub-timer-btn-group {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Footer Styling */
        .site-footer {
            background: var(--bg-side);
            border-top: 1px solid var(--card-border);
            padding: 22px 28px;
            text-align: center;
            margin-top: auto;
            width: 100%;
            z-index: 10;
        }

        .footer-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-countdown {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            color: var(--primary-accent);
            font-weight: 800;
            font-size: 0.95rem;
        }

        .footer-copyright {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        @media print {
            body * { visibility: hidden; }
            .printable, .printable * { visibility: visible; }
            .printable { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
            aside, .btn-action, .controls-row, .site-footer { display: none !important; }
        }

        @media (max-width: 768px) {
            aside.sidebar { position: fixed; left: 0; top: 0; }
            main.main-content { padding: 16px; }
            .main-timer-display { font-size: 3.2rem; }
        }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <span class="nav-text">Study System</span>
                </div>
                <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">الرئيسية والأنشطة</div>
                <button class="nav-btn active" onclick="switchTab('study')">
                    <span class="icon" style="color: var(--color-study);"><i class="fa-solid fa-stopwatch"></i></span>
                    <span class="nav-text">Study Mode (المذاكرة)</span>
                </button>
                <button class="nav-btn" onclick="switchTab('schedule')">
                    <span class="icon" style="color: #3b82f6;"><i class="fa-solid fa-calendar-days"></i></span>
                    <span class="nav-text">Schedule (الجدول)</span>
                </button>
                <button class="nav-btn" onclick="switchTab('tasks')">
                    <span class="icon" style="color: #f59e0b;"><i class="fa-solid fa-list-check"></i></span>
                    <span class="nav-text">Tasks Day (مهام اليوم)</span>
                </button>
                <button class="nav-btn" onclick="switchTab('stats')">
                    <span class="icon" style="color: #ec4899;"><i class="fa-solid fa-chart-pie"></i></span>
                    <span class="nav-text">Stats (الإحصائيات)</span>
                </button>

                <div class="nav-group-title">المناهج والمتابعة</div>
                <button class="nav-btn" onclick="switchTab('lessons')">
                    <span class="icon" style="color: #8b5cf6;"><i class="fa-solid fa-book-bookmark"></i></span>
                    <span class="nav-text">Lessons Task (الفهرس)</span>
                </button>
                <button class="nav-btn" onclick="switchTab('education')">
                    <span class="icon" style="color: #14b8a6;"><i class="fa-solid fa-school"></i></span>
                    <span class="nav-text">Education (الدروس)</span>
                </button>

                <div class="nav-group-title">نمط الحياة والعبادة</div>
                <button class="nav-btn" onclick="switchTab('prayers')">
                    <span class="icon" style="color: #10b981;"><i class="fa-solid fa-mosque"></i></span>
                    <span class="nav-text">الصلاة (القاهرة / مصر)</span>
                </button>
                <button class="nav-btn" onclick="switchTab('sleep')">
                    <span class="icon" style="color: #6366f1;"><i class="fa-solid fa-bed"></i></span>
                    <span class="nav-text">Sleep (تتبع النوم)</span>
                </button>
                <button class="nav-btn" onclick="switchTab('notebook')">
                    <span class="icon" style="color: #f43f5e;"><i class="fa-solid fa-note-sticky"></i></span>
                    <span class="nav-text">Notebook (المفكرة)</span>
                </button>

                <div class="nav-group-title">التقارير للسجل</div>
                <button class="nav-btn" onclick="switchTab('logs')">
                    <span class="icon" style="color: #94a3b8;"><i class="fa-solid fa-clock-rotate-left"></i></span>
                    <span class="nav-text">Logs (السجل العام)</span>
                </button>
            </div>

            <div class="user-profile">
                <div class="profile-badge">
                    <div class="profile-avatar">S</div>
                    <div class="profile-info">
                        <span style="font-weight: 800; font-size: 0.95rem; color: #fff; display:block;">Study System</span>
                        <span style="font-size: 0.75rem; color: var(--color-study);">نشط الآن <i class="fa-solid fa-circle" style="font-size: 8px;"></i></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Area -->
        <main class="main-content">
            <!-- 1. STUDY MODE TAB -->
            <div id="tab-study" class="tab-content active printable">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i class="fa-solid fa-stopwatch" style="color: var(--color-study);"></i> مؤقت المذاكرة الرئيسي (Study Mode)</span>
                        <button class="btn-action" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة PDF</button>
                    </div>
                    
                    <div class="timer-header-label mode-study" id="timerHeaderTitle">Study timer</div>
                    <div class="main-timer-display mode-study" id="mainTimerDisplay">00:00:00</div>
                    
                    <div class="controls-row">
                        <button class="btn-action btn-success" onclick="startMainTimer()"><i class="fa-solid fa-play"></i> تشغيل</button>
                        <button class="btn-action" style="background: var(--color-writing); color: #fff;" onclick="pauseMainTimer()"><i class="fa-solid fa-pause"></i> إيقاف</button>
                        <button class="btn-action" onclick="saveStudySession()"><i class="fa-solid fa-floppy-disk"></i> حفظ الجلسة</button>
                        <button class="btn-action btn-danger" onclick="resetMainTimer()"><i class="fa-solid fa-rotate-right"></i> ريسيت</button>
                    </div>

                    <!-- Sub Timers Grid -->
                    <div class="sub-timers-grid">
                        <!-- Listening Timer Card -->
                        <div class="sub-timer-card" style="border-top: 3px solid var(--color-listening);">
                            <div style="color: var(--color-listening); font-weight: 800;"><i class="fa-solid fa-headphones"></i> Listening</div>
                            <div class="sub-timer-display" id="timerListening" style="color: var(--color-listening);">00:00:00</div>
                            <div class="sub-timer-btn-group">
                                <button class="btn-sm-timer" style="background: var(--color-listening);" onclick="toggleSubTimer('listening')"><i class="fa-solid fa-play"></i> / <i class="fa-solid fa-pause"></i> تشغيل/إيقاف</button>
                                <button class="btn-sm-timer" style="background: #10b981;" onclick="saveSubTimer('listening')"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
                                <button class="btn-sm-timer" style="background: #ef4444;" onclick="resetSubTimer('listening')"><i class="fa-solid fa-rotate-right"></i> ريسيت</button>
                            </div>
                        </div>

                        <!-- Writing Timer Card -->
                        <div class="sub-timer-card" style="border-top: 3px solid var(--color-writing);">
                            <div style="color: var(--color-writing); font-weight: 800;"><i class="fa-solid fa-pen-nib"></i> Writing</div>
                            <div class="sub-timer-display" id="timerWriting" style="color: var(--color-writing);">00:00:00</div>
                            <div class="sub-timer-btn-group">
                                <button class="btn-sm-timer" style="background: var(--color-writing);" onclick="toggleSubTimer('writing')"><i class="fa-solid fa-play"></i> / <i class="fa-solid fa-pause"></i> تشغيل/إيقاف</button>
                                <button class="btn-sm-timer" style="background: #10b981;" onclick="saveSubTimer('writing')"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
                                <button class="btn-sm-timer" style="background: #ef4444;" onclick="resetSubTimer('writing')"><i class="fa-solid fa-rotate-right"></i> ريسيت</button>
                            </div>
                        </div>

                        <!-- Quiz Timer Card -->
                        <div class="sub-timer-card" style="border-top: 3px solid var(--color-quiz);">
                            <div style="color: var(--color-quiz); font-weight: 800;"><i class="fa-solid fa-square-check"></i> Quiz</div>
                            <div class="sub-timer-display" id="timerQuiz" style="color: var(--color-quiz);">00:00:00</div>
                            <div class="sub-timer-btn-group">
                                <button class="btn-sm-timer" style="background: var(--color-quiz);" onclick="toggleSubTimer('quiz')"><i class="fa-solid fa-play"></i> / <i class="fa-solid fa-pause"></i> تشغيل/إيقاف</button>
                                <button class="btn-sm-timer" style="background: #10b981;" onclick="saveSubTimer('quiz')"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
                                <button class="btn-sm-timer" style="background: #ef4444;" onclick="resetSubTimer('quiz')"><i class="fa-solid fa-rotate-right"></i> ريسيت</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Professional Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-countdown">
                <i class="fa-solid fa-hourglass-half"></i>
                <span id="countdownDaysText">304 Day</span>
            </div>
            <div class="footer-copyright">
                © 2026 Amr Abdelhalim . All Rights Reserved
            </div>
        </div>
    </footer>

    <script>
        // Sidebar Toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('tab-' + tabId);
            if(target) target.classList.add('active');
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
        }

        // Sub-timers Logic
        let subTimers = {
            listening: { seconds: 0, interval: null, running: false },
            writing: { seconds: 0, interval: null, running: false },
            quiz: { seconds: 0, interval: null, running: false }
        };

        function formatTime(totalSec) {
            const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function toggleSubTimer(type) {
            let t = subTimers[type];
            if (!t) return;
            if (t.running) {
                clearInterval(t.interval);
                t.running = false;
            } else {
                t.running = true;
                t.interval = setInterval(() => {
                    t.seconds++;
                    const elem = document.getElementById('timer' + type.charAt(0).toUpperCase() + type.slice(1));
                    if (elem) elem.innerText = formatTime(t.seconds);
                }, 1000);
            }
        }

        function resetSubTimer(type) {
            let t = subTimers[type];
            if (!t) return;
            clearInterval(t.interval);
            t.seconds = 0;
            t.running = false;
            const elem = document.getElementById('timer' + type.charAt(0).toUpperCase() + type.slice(1));
            if (elem) elem.innerText = "00:00:00";
        }

        function saveSubTimer(type) {
            let t = subTimers[type];
            const timeStr = formatTime(t ? t.seconds : 0);
            alert(`تم حفظ جلسة مؤقت ${type.toUpperCase()} بنجاح!\nالمدة: ${timeStr}`);
        }

        // Daily Countdown Logic (304 Days Decrementing Daily)
        function initCountdown() {
            const startKey = 'study_system_start_date';
            let startDateVal = localStorage.getItem(startKey);
            
            if (!startDateVal) {
                const now = new Date();
                startDateVal = now.toISOString();
                localStorage.setItem(startKey, startDateVal);
            }

            const startDate = new Date(startDateVal);
            const today = new Date();

            const startDay = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            const currentDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            const diffTime = currentDay - startDay;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            let remainingDays = 304 - diffDays;
            if (remainingDays < 1) remainingDays = 1;

            const daysElem = document.getElementById('countdownDaysText');
            if (daysElem) {
                daysElem.innerText = `${remainingDays} Day`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCountdown();
        });
    </script>
</body>
</html>
