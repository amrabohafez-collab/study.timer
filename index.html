<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Timer & Notebook</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/KxRJyWnp/st-photo-png.png">
    
    <style id="dynamicStyle">
        :root {
            --study-color: #a6e3a1;
            --break-color: #cba6f7;
            --social-color: #89b4fa;
            --afk-color: #f9e2af;
            --clock-color: #a6adc8; 
            --current-theme: var(--study-color);
            
            /* ألوان المواد الخاصة بالمفكرة */
            --arabic-color: #89b4fa;
            --english-color: #a6e3a1;
            --history-color: #f9e2af;
            --physics-color: #f38ba8;
        }

        body { 
            background: #0f0f16; 
            color: var(--current-theme); 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            transition: background 0.5s, color 0.5s;
        }

        .cairo-live-widget {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #181825;
            border: 1px solid #313244;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #6c7086; 
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: left;
            transition: opacity 0.3s ease;
        }
        .cairo-live-widget .widget-clock {
            color: var(--clock-color);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            direction: rtl;
        }

        .brand-title { font-size: 2.5rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 30px; color: var(--current-theme); transition: opacity 0.3s ease; }
        .footer-credits { position: absolute; bottom: 25px; font-size: 0.85rem; color: #585b70; letter-spacing: 0.5px; }

        #mainContainer { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; transition: all 0.3s ease; }
        #mainContainer.sidebar-open { padding-right: 380px; }
        #mainContainer.notebook-open { padding-left: 50vw; } 
        
        #mainApp { text-align: center; width: 100%; max-width: 600px; transition: all 0.3s ease; }
        .timer-box { display: none; }
        .timer-box.active { display: block; }
        .timer-display { font-size: 6rem; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,255,0.1); margin-bottom: 10px; }
        
        .break-input-group { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .break-input-group .input-field { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .break-input-group label { font-size: 0.85rem; opacity: 0.8; color: #cdd6f4;}
        .break-input-group input { background: #181825; border: 1px solid #313244; padding: 8px 12px; border-radius: 8px; color: #cdd6f4; width: 60px; text-align: center; font-size: 1rem; }

        .top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; transition: opacity 0.3s ease; }
        .top-bar button { background: #1e1e2e; border: 1px solid #313244; color: #cdd6f4; padding: 8px 16px; font-size: 0.85rem; }
        
        .btn-notebook-trigger { border-color: #cba6f7 !important; color: #cba6f7 !important; font-weight: bold; }
        .btn-notebook-trigger:hover { background: #cba6f7 !important; color: #11111b !important; }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; transition: opacity 0.3s ease; }
        #bottomModeSelectors { transition: opacity 0.3s ease; }
        
        button { padding: 12px 25px; cursor: pointer; border-radius: 25px; border: 1px solid var(--current-theme); background: #1e1e2e; color: var(--current-theme); font-weight: bold; transition: 0.3s; font-family: inherit; }
        button:hover { background: var(--current-theme); color: #11111b; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .mode-btn { background: #11111b; font-size: 0.9rem; }
        #btn-study { border-color: var(--study-color); color: var(--study-color); }
        #btn-break { border-color: var(--break-color); color: var(--break-color); }
        #btn-social { border-color: var(--social-color); color: var(--social-color); }
        #btn-afk { border-color: var(--afk-color); color: var(--afk-color); }

        .sidebar { position: fixed; right: -400px; top: 0; width: 360px; height: 100%; background: #11111b; border-left: 2px solid var(--current-theme); box-shadow: -5px 0 25px rgba(0,0,0,0.5); transition: right 0.3s ease; z-index: 100; display: flex; flex-direction: column; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--current-theme); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-header-share { background: #313244; border: 1px solid var(--current-theme); color: #fff; padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; }
        .btn-header-share:hover { background: var(--current-theme); color: #11111b; }
        .close-sidebar-btn { background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; }

        .sidebar-content { padding: 12px; flex-grow: 1; overflow-y: scroll; }
        .sidebar-content::-webkit-scrollbar { width: 14px; }
        .sidebar-content::-webkit-scrollbar-track { background: #181825; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--current-theme); border-radius: 7px; border: 2px solid #11111b; }

        /* المفكرة */
        .notebook-sidebar { position: fixed; left: -55vw; top: 0; width: 50vw; height: 100%; background: #11111b; box-shadow: 5px 0 25px rgba(0,0,0,0.5); transition: left 0.3s ease; z-index: 150; display: flex; flex-direction: column; border-right: 2px solid #cba6f7; }
        .notebook-sidebar.open { left: 0; }
        
        .nb-header { padding: 15px 20px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
        .nb-header-right { display: flex; align-items: center; gap: 15px; }
        .nb-title { margin: 0; font-size: 1.4rem; font-weight: bold; }
        .close-nb-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        .nb-content { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; }
        .nb-content::-webkit-scrollbar { width: 8px; }
        .nb-content::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }

        .subject-block { background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; transition: 0.2s; }
        .subject-block.arabic { border-top: 4px solid var(--arabic-color); }
        .subject-block.english { border-top: 4px solid var(--english-color); }
        .subject-block.history { border-top: 4px solid var(--history-color); }
        .subject-block.physics { border-top: 4px solid var(--physics-color); }
        
        .sub-block-title { font-size: 1.15rem; font-weight: bold; text-align: right; margin: 0; direction: rtl; }
        .subject-block.arabic .sub-block-title { color: var(--arabic-color); }
        .subject-block.english .sub-block-title { color: var(--english-color); }
        .subject-block.history .sub-block-title { color: var(--history-color); }
        .subject-block.physics .sub-block-title { color: var(--physics-color); }

        .nb-tabs-row { display: flex; gap: 10px; width: 100%; direction: rtl; }
        .nb-tab-btn { flex: 1; padding: 8px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; border: 1px solid #313244; background: #11111b; cursor: pointer; transition: 0.2s; }
        .nb-tab-btn.btn-done-tab { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.3); }
        .nb-tab-btn.btn-done-tab.active-tab { background: rgba(166, 227, 161, 0.15); border-color: #a6e3a1; }
        .nb-tab-btn.btn-remaining-tab { color: #f38ba8; border-color: rgba(243, 139, 168, 0.3); }
        .nb-tab-btn.btn-remaining-tab.active-tab { background: rgba(243, 139, 168, 0.15); border-color: #f38ba8; }

        .nb-text-container { width: 100%; display: none; direction: rtl; }
        .nb-text-container.active-pane { display: block; }
        
        .nb-textarea { width: 100%; height: 110px; background: #11111b; border: 1px solid #313244; border-radius: 8px; padding: 10px; box-sizing: border-box; resize: none; font-family: inherit; font-size: 0.95rem; line-height: 1.5; outline: none; transition: border-color 0.2s; text-align: right; }
        
        .nb-text-container.done-pane .nb-textarea { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.2); }
        .nb-text-container.done-pane .nb-textarea:focus { border-color: #a6e3a1; }
        .nb-text-container.remaining-pane .nb-textarea { color: #f38ba8; border-color: rgba(243, 139, 168, 0.2); }
        .nb-text-container.remaining-pane .nb-textarea:focus { border-color: #f38ba8; }

        .hide-in-notebook { opacity: 0 !important; pointer-events: none !important; }

        .history-card { background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 10px; margin-bottom: 8px; color: #cdd6f4; font-size: 0.85rem; }
        .card-main-line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222538; padding-bottom: 4px; margin-bottom: 4px; }
        .card-subject { font-weight: bold; color: #fff; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
        .card-duration { font-weight: bold; color: var(--current-theme); }
        .card-desc { color: #a6adc8; font-size: 0.8rem; margin: 4px 0; background: #11111b; padding: 4px 6px; border-radius: 4px; text-align: right; direction: rtl; word-wrap: break-word; }
        
        .card-time-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 5px; font-family: inherit; direction: rtl; gap: 5px; }
        .time-tag { padding: 2px 5px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
        .time-tag.start { background: rgba(166, 227, 161, 0.1); color: #a6e3a1; }
        .time-tag.end { background: rgba(243, 139, 168, 0.1); color: #f38ba8; }
        
        /* تصميم ذكي وناعم لعرض مدة التوقف */
        .pause-tag-row { display: flex; justify-content: center; margin-top: 5px; }
        .pause-tag { background: rgba(249, 226, 175, 0.08); color: #f9e2af; border: 1px dashed rgba(249, 226, 175, 0.25); font-size: 0.73rem; padding: 2px 10px; border-radius: 12px; font-weight: 500; text-align: center; direction: rtl; }

        .card-bottom-info { font-size: 0.75rem; color: #7f849c; display: flex; justify-content: space-between; margin-top: 6px; }
        .card-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; align-items: center;}
        .card-actions button { padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; border: 1px solid #313244; background: none;}
        .btn-edit { color: #f9e2af; border-color: #f9e2af !important; }
        .btn-delete { color: #f38ba8; border-color: #f38ba8 !important; }
        .btn-recovery { color: #a6e3a1; border-color: #a6e3a1 !important; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e2e; border: 2px solid var(--current-theme); padding: 20px; border-radius: 12px; width: 320px; text-align: right; direction: rtl; color: #cdd6f4; }
        .modal-content h3 { margin-top: 0; color: var(--current-theme); text-align: center; font-size: 1.1rem;}
        .modal-content label { display: block; margin: 8px 0 4px; font-size: 0.85rem;}
        .modal-content input, .modal-content textarea { width: 100%; padding: 8px; background: #11111b; border: 1px solid #313244; border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; font-family: inherit;}
        .modal-content textarea { resize: none; height: 60px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; justify-content: center;}
        .modal-actions button { padding: 6px 16px; font-size: 0.85rem;}

        @media print {
            body * { visibility: hidden; background: white !important; color: black !important; }
            #sidebarHistory, #sidebarHistory * { visibility: hidden; }
            body.printing-notebook #notebookSidebar, body.printing-notebook #notebookSidebar * { visibility: visible; }
            body.printing-notebook #notebookSidebar { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div id="cairoWidget" class="cairo-live-widget">
        <div id="cairoClock" class="widget-clock">جاري الحساب...</div>
        <div id="cairoDate">جاري الحساب...</div>
    </div>

    <div id="topBarNav" class="top-bar">
        <button class="btn-notebook-trigger" onclick="openNotebook()">Notebook 📓</button>
        <button onclick="openHistory('study')">Study History 📚</button>
        <button onclick="openHistory('break')">Break History ☕</button>
        <button onclick="openMergeHistory('social')">Social & AFK History 📱⏳</button>
        <button style="border-color:#f38ba8; color:#f38ba8;" onclick="openHistory('trash')">Trash / Recovery 🗑️</button>
    </div>

    <div id="mainContainer">
        <div id="appTitle" class="brand-title">Study Timer</div>

        <div id="mainApp">
            <div id="container-study" class="timer-box active">
                <div id="display-study" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button id="saveBtnStudy" onclick="saveSessionPrompt()">Save</button>
                    <button id="resetBtnStudy" onclick="endTimer()">Reset</button>
                    <button id="miniBtnStudy" onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-break" class="timer-box">
                <div id="display-break" class="timer-display">05:00</div>
                <div class="break-input-group">
                    <div class="input-field"><label>Hours</label><input type="number" id="breakHoursInput" value="0" min="0" max="24" onchange="setBreakDuration()"></div>
                    <div class="input-field"><label>Minutes</label><input type="number" id="breakMinutesInput" value="5" min="0" max="59" onchange="setBreakDuration()"></div>
                </div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-social" class="timer-box">
                <div id="display-social" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-afk" class="timer-box">
                <div id="display-afk" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="bottomModeSelectors" class="controls" style="margin-top: 35px; border-top: 1px solid #181825; padding-top: 20px;">
                <button id="btn-study" class="mode-btn" onclick="switchMode('study')">Study Mode 📚</button>
                <button id="btn-break" class="mode-btn" onclick="switchMode('break')">Break Mode ☕</button>
                <button id="btn-social" class="mode-btn" onclick="switchMode('social')">Social Timer 📱</button>
                <button id="btn-afk" class="mode-btn" onclick="switchMode('afk')">AFK Timer ⏳</button>
            </div>
        </div>
    </div>

    <!-- واجهة المفكرة -->
    <div id="notebookSidebar" class="notebook-sidebar">
        <div class="nb-header">
            <button class="close-nb-btn" style="color: #f38ba8;" onclick="closeNotebook()">✕</button>
            <div class="nb-header-right">
                <button class="btn-nb-share" style="background:#181825; border:1px solid #a6e3a1; color:#a6e3a1; padding:6px 14px; font-size:0.85rem; border-radius:20px; font-weight:bold;" onclick="printNotebook()">Share PDF 📄</button>
                <h2 class="nb-title" style="color: #cba6f7;">Notebook 📓</h2>
            </div>
        </div>
        <div class="nb-content">
            <div class="subject-block arabic">
                <p class="sub-block-title">1. اللغة العربية 📚</p>
                <div class="nb-tabs-row">
                    <button id="tab-arabic-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('arabic', 'done')">Done ✅</button>
                    <button id="tab-arabic-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('arabic', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-arabic-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-arabic-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-arabic-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-arabic-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
            <div class="subject-block english">
                <p class="sub-block-title">2. اللغة الإنجليزية 🇬🇧</p>
                <div class="nb-tabs-row">
                    <button id="tab-english-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('english', 'done')">Done ✅</button>
                    <button id="tab-english-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('english', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-english-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-english-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-english-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-english-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
            <div class="subject-block history">
                <p class="sub-block-title">3. التاريخ 🏛️</p>
                <div class="nb-tabs-row">
                    <button id="tab-history-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('history', 'done')">Done ✅</button>
                    <button id="tab-history-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('history', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-history-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-history-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-history-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-history-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
            <div class="subject-block physics">
                <p class="sub-block-title">4. الفيزياء ⚡</p>
                <div class="nb-tabs-row">
                    <button id="tab-physics-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('physics', 'done')">Done ✅</button>
                    <button id="tab-physics-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('physics', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-physics-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-physics-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-physics-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-physics-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية للسجلات -->
    <div id="sidebarHistory" class="sidebar">
        <div class="sidebar-header">
            <button class="close-sidebar-btn" onclick="closeHistory()">✕</button>
            <div class="header-actions">
                <button id="printHistoryBtn" class="btn-header-share" onclick="printFullHistory()">Share PDF 📄</button>
                <h2 id="sidebarTitle">History</h2>
            </div>
        </div>
        <div id="mergeTabsRow" class="nb-tabs-row" style="padding: 10px; display: none;">
            <button id="mergeTabSocial" class="nb-tab-btn" style="color: #89b4fa; border-color: #89b4fa;" onclick="switchMergeView('social')">Social History 📱</button>
            <button id="mergeTabAfk" class="nb-tab-btn" style="color: #f9e2af; border-color: #f9e2af;" onclick="switchMergeView('afk')">AFK History ⏳</button>
        </div>
        <div id="sidebarContent" class="sidebar-content"></div>
    </div>

    <!-- المودالز -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <h3 id="modalHeaderTitle">حفظ السجل الجديد</h3>
            <label>اسم المادة / النشاط:</label>
            <input type="text" id="modalSubjectInput" placeholder="مثال: لغة عربية (بلاغة)...">
            <label>وصف المذاكرة:</label>
            <textarea id="modalDescInput" placeholder="اكتب تفاصيل ما تم إنجازه هنا..."></textarea>
            <div class="modal-actions">
                <button onclick="confirmSaveSession()">حفظ السجل</button>
                <button style="color:#f38ba8; border-color:#f38ba8;" onclick="closeModal('saveModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل بيانات السجل</h3>
            <label>اسم المادة / النشاط:</label>
            <input type="text" id="editSubjectInput">
            <label>وصف النشاط:</label>
            <textarea id="editDescInput"></textarea>
            <label>اليوم:</label>
            <input type="text" id="editDayInput">
            <label>التاريخ:</label>
            <input type="text" id="editDateInput">
            <div class="modal-actions">
                <button onclick="confirmEditSession()">تحديث</button>
                <button style="color:#f38ba8; border-color:#f38ba8;" onclick="closeModal('editModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="footer-credits">© 2026 Amr Abdelhalim . All Rights Reserved</div>

    <!-- عناصر الخفاء الخاصة بالـ Mini Mode -->
    <canvas id="videoCanvas" width="400" height="160" style="display:none;"></canvas>
    <video id="pipVideo" autoplay muted playsinline style="display:none;"></video>

    <script>
        // استدعاء القيم المحفوظة مسبقًا لجميع الأوضاع لحماية العدادات من الضياع عند الخروج بالخطأ
        let timers = {
            study: { seconds: parseInt(localStorage.getItem('savedStudySeconds')) || 0, type: 'up' },
            break: { seconds: parseInt(localStorage.getItem('savedBreakSeconds')) || 300, type: 'down', default: 300 },
            social: { seconds: parseInt(localStorage.getItem('savedSocialSeconds')) || 0, type: 'up' },
            afk: { seconds: parseInt(localStorage.getItem('savedAfkSeconds')) || 0, type: 'up' }
        };

        let currentActiveMode = 'study';
        let isRunning = false;
        let globalIntervalId = null;
        let lastTimestamp = null; 

        // متغيرات تتبع جلسة الوقت الحالي والتوقفات
        let sessionStartTime = null; 
        let currentCairoGlobalDateObject = new Date(); 
        let pauseTrackingArray = []; // لتسجيل لحظات التوقف والاستئناف بدقة

        let historyData = JSON.parse(localStorage.getItem('timerHistoryData')) || { study: [], break: [], social: [], afk: [], trash: [] };
        let activeHistoryView = 'study'; 
        let currentEditingIndex = null;

        const MY_AUDIO_URL = "https://files.catbox.moe/d5k1bg.mp3"; 
        let customAudio = new Audio(MY_AUDIO_URL);

        // متغيرات نافذة المصغر Mini
        let canvasStream = null;
        let pipCanvas = document.getElementById('videoCanvas');
        let pipCtx = pipCanvas.getContext('2d');
        let pipVideo = document.getElementById('pipVideo');

        window.onload = function() {
            // تحديث العرض لكافة المؤقتات بناءً على القيمة المخزنة
            updateDisplay('study');
            updateDisplay('break');
            updateDisplay('social');
            updateDisplay('afk');
            
            // قراءة وتعيين إعدادات وقت الاستراحة المخصص إن وجد
            if (localStorage.getItem('savedBreakDefault')) {
                timers.break.default = parseInt(localStorage.getItem('savedBreakDefault'));
            }
            
            updateThemeColors();
            startCairoLiveClockAndEngine(); 
            loadNotebookData();
            setupPipStream();
        }

        // دالة تحويل التوقيت إلى الصياغة العربية (ظهراً، عصراً، عشاءً.. إلخ) بدلاً من AM/PM
        function getCairoPrayerPeriodInfo(dateObj) {
            if (!dateObj) return "00:00";
            let formatter24 = new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Cairo', hour: 'numeric', hour12: false });
            let formatterMinutes = new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Cairo', minute: 'numeric' });
            let hours24 = parseInt(formatter24.format(dateObj), 10);
            let minutes = parseInt(formatterMinutes.format(dateObj), 10);
            let totalMinutes = (hours24 * 60) + minutes;
            let periodName = "";

            let m430_am = (4 * 60) + 30;  
            let m600_am = (6 * 60);       
            let m800_am = (8 * 60);       
            let m1200_pm = (12 * 60);     
            let m430_pm = (16 * 60) + 30; 
            let m800_pm = (20 * 60);      
            let m930_pm = (21 * 60) + 30; 

            if (totalMinutes >= 0 && totalMinutes < m430_am) periodName = "الليل";
            else if (totalMinutes >= m430_am && totalMinutes < m600_am) periodName = "فجراً";
            else if (totalMinutes >= m600_am && totalMinutes < m800_am) periodName = "الشروق";
            else if (totalMinutes >= m800_am && totalMinutes < m1200_pm) periodName = "صباحاً";
            else if (totalMinutes >= m1200_pm && totalMinutes < m430_pm) periodName = "ظهراً";
            else if (totalMinutes >= m430_pm && totalMinutes < m800_pm) periodName = "عصراً";
            else if (totalMinutes >= m800_pm && totalMinutes < m930_pm) periodName = "المغرب";
            else periodName = "العشاء";

            let displayHours = hours24 % 12;
            if (displayHours === 0) displayHours = 12;
            return `${displayHours}:${minutes.toString().padStart(2, '0')} ${periodName}`;
        }

        function startCairoLiveClockAndEngine() {
            setInterval(() => {
                currentCairoGlobalDateObject = new Date(); 
                let prayerFormattedTime = getCairoPrayerPeriodInfo(currentCairoGlobalDateObject);
                let dateFormatter = new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Cairo', day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'long' });
                let dateParts = dateFormatter.formatToParts(currentCairoGlobalDateObject);
                let dayNameStr = ""; let dayNum = ""; let monthNum = ""; let yearNum = "";
                
                dateParts.forEach(p => {
                    if (p.type === 'weekday') dayNameStr = p.value;
                    if (p.type === 'day') dayNum = p.value;
                    if (p.type === 'month') monthNum = p.value;
                    if (p.type === 'year') yearNum = p.value;
                });
                
                let arabicDay = dayNameStr;
                if(dayNameStr.includes("Sunday") || dayNameStr.includes("الأحد")) arabicDay = "الأحد";
                if(dayNameStr.includes("Monday") || dayNameStr.includes("الإثنين")) arabicDay = "الإثنين";
                if(dayNameStr.includes("Tuesday") || dayNameStr.includes("الثلاثاء")) arabicDay = "الثلاثاء";
                if(dayNameStr.includes("Wednesday") || dayNameStr.includes("الأربعاء")) arabicDay = "الأربعاء";
                if(dayNameStr.includes("Thursday") || dayNameStr.includes("الخميس")) arabicDay = "الخميس";
                if(dayNameStr.includes("Friday") || dayNameStr.includes("الجمعة")) arabicDay = "الجمعة";
                if(dayNameStr.includes("Saturday") || dayNameStr.includes("السبت")) arabicDay = "السبت";

                document.getElementById("cairoClock").innerText = prayerFormattedTime;
                document.getElementById("cairoDate").innerText = `${arabicDay}، ${dayNum}/${monthNum}/${yearNum}`;
            }, 1000);
        }

        // ==================== محرك العداد الذكي وحساب فترات التوقف ====================
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            lastTimestamp = Date.now();
            
            // في حال تم الاستئناف من التوقف، سجل نهاية التوقف
            if (sessionStartTime && pauseTrackingArray.length > 0) {
                let lastPause = pauseTrackingArray[pauseTrackingArray.length - 1];
                if (lastPause.end === null) {
                    lastPause.end = Date.now();
                }
            }

            if (!sessionStartTime) {
                sessionStartTime = getCairoPrayerPeriodInfo(new Date());
                pauseTrackingArray = []; // تصفير قائمة التوقفات للجلسة الجديدة
            }

            globalIntervalId = setInterval(() => {
                let currentTimestamp = Date.now();
                let deltaSeconds = Math.floor((currentTimestamp - lastTimestamp) / 1000);
                
                if (deltaSeconds >= 1) {
                    let modeData = timers[currentActiveMode];
                    if (modeData.type === 'up') {
                        modeData.seconds += deltaSeconds;
                    } else {
                        modeData.seconds -= deltaSeconds;
                        if (modeData.seconds <= 0) {
                            modeData.seconds = 0;
                            pauseTimer();
                            customAudio.play().catch(e => console.log("Audio play deferred"));
                        }
                    }
                    
                    lastTimestamp += deltaSeconds * 1000; 
                    
                    updateDisplay(currentActiveMode);
                    
                    // حفظ لحظي وتلقائي لحالة العداد بالمتصفح لمنع ضياع الوقت عند الخروج الخاطئ
                    saveCurrentTimerToLocalStorage(currentActiveMode);
                    
                    drawPipCanvas(); 
                }
            }, 200);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(globalIntervalId);
            
            // إضافة وقت التوقف الحالي للمصفوفة
            pauseTrackingArray.push({
                start: Date.now(),
                end: null
            });
        }

        function saveCurrentTimerToLocalStorage(mode) {
            if (mode === 'study') localStorage.setItem('savedStudySeconds', timers.study.seconds);
            if (mode === 'break') localStorage.setItem('savedBreakSeconds', timers.break.seconds);
            if (mode === 'social') localStorage.setItem('savedSocialSeconds', timers.social.seconds);
            if (mode === 'afk') localStorage.setItem('savedAfkSeconds', timers.afk.seconds);
        }

        function clearTimerLocalStorage(mode) {
            if (mode === 'study') localStorage.removeItem('savedStudySeconds');
            if (mode === 'break') localStorage.removeItem('savedBreakSeconds');
            if (mode === 'social') localStorage.removeItem('savedSocialSeconds');
            if (mode === 'afk') localStorage.removeItem('savedAfkSeconds');
        }

        function endTimer() {
            pauseTimer();
            let modeData = timers[currentActiveMode];
            if (modeData.type === 'up') {
                modeData.seconds = 0;
            } else {
                modeData.seconds = modeData.default || 300;
            }
            
            clearTimerLocalStorage(currentActiveMode);
            sessionStartTime = null;
            pauseTrackingArray = [];
            updateDisplay(currentActiveMode);
            drawPipCanvas();
        }

        // ==================== دوال التحكم والواجهة الأساسية ====================
        function switchMode(mode) {
            pauseTimer();
            document.querySelectorAll('.timer-box').forEach(box => box.classList.remove('active'));
            document.getElementById(`container-${mode}`).classList.add('active');
            currentActiveMode = mode;
            updateThemeColors();
            updateDisplay(mode);
        }

        function updateThemeColors() {
            let root = document.documentElement;
            if (currentActiveMode === 'study') root.style.setProperty('--current-theme', 'var(--study-color)');
            if (currentActiveMode === 'break') root.style.setProperty('--current-theme', 'var(--break-color)');
            if (currentActiveMode === 'social') root.style.setProperty('--current-theme', 'var(--social-color)');
            if (currentActiveMode === 'afk') root.style.setProperty('--current-theme', 'var(--afk-color)');
        }

        function formatTime(totalSeconds) {
            let hrs = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = totalSeconds % 60;
            if (hrs > 0) {
                return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay(mode) {
            let displayElement = document.getElementById(`display-${mode}`);
            if (displayElement) {
                displayElement.innerText = formatTime(timers[mode].seconds);
            }
        }

        function setBreakDuration() {
            let hrs = parseInt(document.getElementById('breakHoursInput').value) || 0;
            let mins = parseInt(document.getElementById('breakMinutesInput').value) || 0;
            let total = (hrs * 3600) + (mins * 60);
            timers.break.seconds = total;
            timers.break.default = total;
            localStorage.setItem('savedBreakDefault', total);
            localStorage.setItem('savedBreakSeconds', total);
            updateDisplay('break');
        }

        // ==================== المفكرة وسجل الحفظ ====================
        function openNotebook() {
            document.getElementById('notebookSidebar').classList.add('open');
            document.getElementById('mainContainer').classList.add('notebook-open');
        }

        function closeNotebook() {
            document.getElementById('notebookSidebar').classList.remove('open');
            document.getElementById('mainContainer').classList.remove('notebook-open');
        }

        function switchNbPane(subject, type) {
            document.querySelectorAll(`.subject-block.${subject} .nb-tab-btn`).forEach(b => b.classList.remove('active-tab'));
            document.querySelectorAll(`.subject-block.${subject} .nb-text-container`).forEach(p => p.classList.remove('active-pane'));
            
            document.getElementById(`tab-${subject}-${type}`).classList.add('active-tab');
            document.getElementById(`pane-${subject}-${type}`).classList.add('active-pane');
        }

        function saveNotebookData() {
            let data = {};
            document.querySelectorAll('.nb-textarea').forEach(area => {
                data[area.id] = area.value;
            });
            localStorage.setItem('notebookData', JSON.stringify(data));
        }

        function loadNotebookData() {
            let data = JSON.parse(localStorage.getItem('notebookData')) || {};
            Object.keys(data).forEach(id => {
                let el = document.getElementById(id);
                if (el) el.value = data[id];
            });
        }

        function openHistory(type) {
            activeHistoryView = type;
            document.getElementById('sidebarTitle').innerText = `${type.toUpperCase()} History`;
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('mergeTabsRow').style.display = 'none';
            renderHistoryContent();
        }

        function openMergeHistory(primaryType) {
            activeHistoryView = primaryType;
            document.getElementById('sidebarTitle').innerText = `Merged History`;
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('mergeTabsRow').style.display = 'flex';
            switchMergeView(primaryType);
        }

        function switchMergeView(type) {
            activeHistoryView = type;
            document.querySelectorAll('#mergeTabsRow button').forEach(b => b.style.opacity = '0.5');
            if (type === 'social') document.getElementById('mergeTabSocial').style.opacity = '1';
            if (type === 'afk') document.getElementById('mergeTabAfk').style.opacity = '1';
            renderHistoryContent();
        }

        function closeHistory() {
            document.getElementById('sidebarHistory').classList.remove('open');
            document.getElementById('mainContainer').classList.remove('sidebar-open');
        }

        function renderHistoryContent() {
            let container = document.getElementById('sidebarContent');
            container.innerHTML = '';
            let list = historyData[activeHistoryView] || [];
            if (list.length === 0) {
                container.innerHTML = `<p style="color:#6c7086; text-align:center; padding: 20px;">لا يوجد سجلات حالياً.</p>`;
                return;
            }
            list.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = 'history-card';
                
                // تحديد ما إذا كان هناك فترات توقف لعرضها
                let pauseHtml = "";
                if (item.totalPausedSeconds && item.totalPausedSeconds > 0) {
                    let pMin = Math.round(item.totalPausedSeconds / 60);
                    if (pMin === 0) pMin = 1; // دقيقة على الأقل
                    let pauseFormatted = pMin >= 60 ? `${Math.floor(pMin/60)} ساعة و ${pMin%60} دقيقة` : `${pMin} دقيقة`;
                    pauseHtml = `
                        <div class="pause-tag-row">
                            <span class="pause-tag">⏱️ إجمالي فترات التوقف: ${pauseFormatted}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-main-line">
                        <span class="card-duration">${item.duration}</span>
                        <span class="card-subject">${item.subject || 'بدون اسم'}</span>
                    </div>
                    ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
                    <div class="card-time-row">
                        <span class="time-tag start">بدأ: ${item.start || '--:--'}</span>
                        <span class="time-tag end">انتهى: ${item.end || '--:--'}</span>
                    </div>
                    ${pauseHtml}
                    <div class="card-bottom-info">
                        <span>${item.day || ''} - ${item.date || ''}</span>
                    </div>
                    <div class="card-actions">
                        ${activeHistoryView === 'trash' ? 
                            `<button class="btn-recovery" onclick="recoverSession(${index})">استرجاع</button>` : 
                            `<button class="btn-edit" onclick="openEditModal(${index})">تعديل</button>
                             <button class="btn-delete" onclick="deleteSession(${index})">حذف</button>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function saveSessionPrompt() {
            if (timers[currentActiveMode].seconds === 0) {
                alert("لا توجد ثوانٍ لحفظها!");
                return;
            }
            document.getElementById('modalSubjectInput').value = '';
            document.getElementById('modalDescInput').value = '';
            document.getElementById('saveModal').style.display = 'flex';
        }

        function confirmSaveSession() {
            let sub = document.getElementById('modalSubjectInput').value.trim();
            let dsc = document.getElementById('modalDescInput').value.trim();
            let totalSec = timers[currentActiveMode].seconds;
            let endStr = getCairoPrayerPeriodInfo(new Date());

            // حساب وقت الإيقاف المؤقت بدقة
            let totalPausedMs = 0;
            pauseTrackingArray.forEach(p => {
                let stopTime = p.end ? p.end : Date.now(); // إذا كانت لا تزال متوقفة عند الحفظ
                totalPausedMs += (stopTime - p.start);
            });
            let totalPausedSeconds = Math.floor(totalPausedMs / 1000);

            let record = {
                subject: sub || (currentActiveMode === 'study' ? "مذاكرة عامة" : currentActiveMode),
                desc: dsc,
                duration: formatTime(totalSec),
                start: sessionStartTime || endStr,
                end: endStr,
                totalPausedSeconds: totalPausedSeconds, // تخزين ثواني التوقف المؤقت
                day: document.getElementById('cairoDate').innerText.split('،')[0],
                date: document.getElementById('cairoDate').innerText.split('،')[1] || new Date().toLocaleDateString()
            };

            historyData[currentActiveMode].unshift(record);
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            
            document.getElementById('saveModal').style.display = 'none';
            endTimer();
            alert("تم حفظ الجلسة بنجاح!");
        }

        function openEditModal(index) {
            currentEditingIndex = index;
            let record = historyData[activeHistoryView][index];
            document.getElementById('editSubjectInput').value = record.subject;
            document.getElementById('editDescInput').value = record.desc || '';
            document.getElementById('editDayInput').value = record.day || '';
            document.getElementById('editDateInput').value = record.date || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function confirmEditSession() {
            if (currentEditingIndex === null) return;
            let record = historyData[activeHistoryView][currentEditingIndex];
            record.subject = document.getElementById('editSubjectInput').value.trim();
            record.desc = document.getElementById('editDescInput').value.trim();
            record.day = document.getElementById('editDayInput').value.trim();
            record.date = document.getElementById('editDateInput').value.trim();
            
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            document.getElementById('editModal').style.display = 'none';
            renderHistoryContent();
        }

        function deleteSession(index) {
            if(!confirm("هل أنت متأكد من نقل هذا السجل للمهملات؟")) return;
            let item = historyData[activeHistoryView].splice(index, 1)[0];
            item.originalType = activeHistoryView; 
            historyData.trash.unshift(item);
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            renderHistoryContent();
        }

        function recoverSession(index) {
            let item = historyData.trash.splice(index, 1)[0];
            let targetType = item.originalType || 'study';
            delete item.originalType;
            historyData[targetType].unshift(item);
            localStorage.setItem('timerHistoryData', JSON.stringify(historyData));
            renderHistoryContent();
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // ==================== ميزات إضافية (PDF و Mini) ====================
        function printNotebook() {
            document.body.classList.add('printing-notebook');
            window.print();
            document.body.classList.remove('printing-notebook');
        }

        function printFullHistory() {
            window.print();
        }

        function setupPipStream() {
            try {
                canvasStream = pipCanvas.captureStream(10);
                pipVideo.srcObject = canvasStream;
            } catch (e) {
                console.log("Mini Canvas capture not fully supported here.");
            }
        }

        function drawPipCanvas() {
            pipCtx.fillStyle = "#11111b";
            pipCtx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
            
            pipCtx.fillStyle = "#cba6f7";
            pipCtx.font = "bold 24px Arial";
            pipCtx.textAlign = "center";
            pipCtx.fillText(currentActiveMode.toUpperCase() + " TIMER", 200, 50);
            
            pipCtx.fillStyle = "#ffffff";
            pipCtx.font = "bold 55px Courier New";
            pipCtx.fillText(formatTime(timers[currentActiveMode].seconds), 200, 120);
        }

        async function requestMini() {
            drawPipCanvas();
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert("واجهة الـ PiP (Mini) مدعومة في المتصفحات الحديثة فقط بعد تشغيل العداد مرة واحدة.");
            }
        }
    </script>
</body>
