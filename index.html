<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Study Timer | Professional System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="countdown-container">
        <span id="countdown-display">جاري التحميل...</span>
    </div>
    <div id="mainApp">
        <div class="timer-display" id="timer">00:00</div>
        <div class="controls">
            <button onclick="startTimer()">بدء</button>
            <button onclick="pauseTimer()">إيقاف</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
