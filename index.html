<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study System</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/KxRJyWnp/st-photo-png.png">
    
    <style id="dynamicStyle">
        :root {
            --study-color: #a6e3a1;
            --break-color: #cba6f7;
            --social-color: #89b4fa;
            --quiz-color: #89b4fa;
            --afk-color: #f9e2af;
            --clock-color: #a6adc8; 
            --exam-color: #89b4fa;
            --schedule-color: #f5e0dc;
            --current-theme: var(--study-color);
            
            --arabic-color: #89b4fa;
            --english-color: #a6e3a1;
            --history-color: #f9e2af;
            --physics-color: #f38ba8;
        }

        body { 
            background: #0f0f16; 
            color: var(--current-theme); 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            transition: background 0.5s, color 0.5s;
        }

        .cairo-live-widget {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #181825;
            border: 1px solid #313244;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #6c7086; 
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: left;
            transition: opacity 0.3s ease;
        }
        .cairo-live-widget .widget-clock {
            color: var(--clock-color);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            direction: rtl;
        }

        /* Modern Auth Header Trigger Bar */
        .auth-status-bar {
            position: absolute;
            top: 20px;
            left: 210px;
            z-index: 15;
        }
        .auth-btn-trigger {
            background: rgba(24, 24, 37, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cdd6f4;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-btn-trigger:hover {
            border-color: var(--current-theme);
            color: var(--current-theme);
            box-shadow: 0 0 12px var(--current-theme);
            transform: translateY(-1px);
        }

        .brand-title { font-size: 2.5rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 30px; color: var(--current-theme); transition: opacity 0.3s ease; }
        
        .exam-countdown-container {
            position: absolute;
            bottom: 45px;
            text-align: center;
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 5;
        }

        .exam-countdown-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--exam-color);
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(137, 180, 250, 0.3);
            font-family: 'Segoe UI', sans-serif;
        }

        .exam-countdown-sub {
            font-size: 0.75rem;
            color: #a6adc8;
            letter-spacing: 1.5px;
            font-weight: 500;
            font-family: monospace, 'Segoe UI', sans-serif;
        }

        .footer-credits { position: absolute; bottom: 15px; font-size: 0.85rem; color: #585b70; letter-spacing: 0.5px; }

        #mainContainer { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; transition: all 0.3s ease; }
        #mainContainer.sidebar-open { padding-right: 380px; }
        #mainContainer.notebook-open { padding-left: 50vw; } 
        
        #mainApp { text-align: center; width: 100%; max-width: 600px; transition: all 0.3s ease; }
        .timer-box { display: none; }
        .timer-box.active { display: block; }
        .timer-display { font-size: 6rem; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,255,0.1); margin-bottom: 10px; }
        
        .break-input-group { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .break-input-group .input-field { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .break-input-group label { font-size: 0.85rem; opacity: 0.8; color: #cdd6f4;}
        .break-input-group input { background: #181825; border: 1px solid #313244; padding: 8px 12px; border-radius: 8px; color: #cdd6f4; width: 60px; text-align: center; font-size: 1rem; }

        .menu-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e1e2e;
            border: 1px solid #313244;
            color: #cdd6f4;
            padding: 10px 14px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            z-index: 110;
            transition: 0.3s;
        }
        .menu-toggle-btn:hover {
            background: var(--current-theme);
            color: #11111b;
        }

        .top-bar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 260px;
            height: 100%;
            background: #11111b;
            border-left: 2px solid #313244;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 80px 20px 20px 20px;
            z-index: 105;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .top-bar.active { right: 0; }
        .top-bar button {
            background: #1e1e2e;
            border: 1px solid #313244;
            color: #cdd6f4;
            padding: 10px 16px;
            font-size: 0.85rem;
            text-align: right;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .top-bar button:hover { background: #181825; border-color: var(--current-theme); }
        
        .btn-notebook-trigger { border-color: #cba6f7 !important; color: #cba6f7 !important; font-weight: bold; }
        .btn-notebook-trigger:hover { background: #cba6f7 !important; color: #11111b !important; }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; transition: opacity 0.3s ease; }
        
        button { padding: 12px 25px; cursor: pointer; border-radius: 25px; border: 1px solid var(--current-theme); background: #1e1e2e; color: var(--current-theme); font-weight: bold; transition: 0.3s; font-family: inherit; }
        button:hover { background: var(--current-theme); color: #11111b; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .mode-btn { background: #11111b; font-size: 0.9rem; }
        #btn-study { border-color: var(--study-color); color: var(--study-color); }
        #btn-break { border-color: var(--break-color); color: var(--break-color); }
        #btn-quiz { border-color: var(--quiz-color); color: var(--quiz-color); }
        #btn-afk { border-color: var(--afk-color); color: var(--afk-color); }

        .sidebar { position: fixed; right: -400px; top: 0; width: 360px; height: 100%; background: #11111b; border-left: 2px solid var(--current-theme); box-shadow: -5px 0 25px rgba(0,0,0,0.5); transition: right 0.3s ease; z-index: 100; display: flex; flex-direction: column; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--current-theme); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-header-share { background: #313244; border: 1px solid var(--current-theme); color: #fff; padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; }
        .btn-header-share:hover { background: var(--current-theme); color: #11111b; }
        .close-sidebar-btn { background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; }

        .sidebar-content { padding: 12px; flex-grow: 1; overflow-y: scroll; }
        .sidebar-content::-webkit-scrollbar { width: 14px; }
        .sidebar-content::-webkit-scrollbar-track { background: #181825; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--current-theme); border-radius: 7px; border: 2px solid #11111b; }

        /* History Nav Subtabs */
        .history-tabs-nav { display: flex; gap: 6px; margin-bottom: 12px; background: #181825; padding: 4px; border-radius: 8px; border: 1px solid #313244; }
        .history-tab-btn { flex: 1; padding: 6px; font-size: 0.75rem; font-weight: bold; border: none; background: transparent; color: #a6adc8; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .history-tab-btn.active { background: var(--current-theme); color: #11111b; }

        .notebook-sidebar { position: fixed; left: -55vw; top: 0; width: 50vw; height: 100%; background: #11111b; box-shadow: 5px 0 25px rgba(0,0,0,0.5); transition: left 0.3s ease; z-index: 150; display: flex; flex-direction: column; border-right: 2px solid #cba6f7; }
        .notebook-sidebar.open { left: 0; }
        
        .nb-header { padding: 15px 20px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
        .nb-header-right { display: flex; align-items: center; gap: 15px; }
        .nb-title { margin: 0; font-size: 1.4rem; font-weight: bold; }
        .close-nb-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        .nb-content { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; }
        .nb-content::-webkit-scrollbar { width: 8px; }
        .nb-content::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }

        .subject-block { background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; transition: 0.2s; }
        .subject-block.arabic { border-top: 4px solid var(--arabic-color); }
        .subject-block.english { border-top: 4px solid var(--english-color); }
        .subject-block.history { border-top: 4px solid var(--history-color); }
        .subject-block.physics { border-top: 4px solid var(--physics-color); }
        
        .sub-block-title { font-size: 1.15rem; font-weight: bold; text-align: right; margin: 0; direction: rtl; }
        .subject-block.arabic .sub-block-title { color: var(--arabic-color); }
        .subject-block.english .sub-block-title { color: var(--english-color); }
        .subject-block.history .sub-block-title { color: var(--history-color); }
        .subject-block.physics .sub-block-title { color: var(--physics-color); }

        .nb-tabs-row { display: flex; gap: 10px; width: 100%; direction: rtl; }
        .nb-tab-btn { flex: 1; padding: 8px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; border: 1px solid #313244; background: #11111b; cursor: pointer; transition: 0.2s; }
        .nb-tab-btn.btn-done-tab { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.3); }
        .nb-tab-btn.btn-done-tab.active-tab { background: rgba(166, 227, 161, 0.15); border-color: #a6e3a1; }
        .nb-tab-btn.btn-remaining-tab { color: #f38ba8; border-color: rgba(243, 139, 168, 0.3); }
        .nb-tab-btn.btn-remaining-tab.active-tab { background: rgba(243, 139, 168, 0.15); border-color: #f38ba8; }

        .nb-text-container { width: 100%; display: none; direction: rtl; }
        .nb-text-container.active-pane { display: block; }
        
        .nb-textarea { width: 100%; height: 110px; background: #11111b; border: 1px solid #313244; border-radius: 8px; padding: 10px; box-sizing: border-box; resize: none; font-family: inherit; font-size: 0.95rem; line-height: 1.5; outline: none; transition: border-color 0.2s; text-align: right; }
        
        .nb-text-container.done-pane .nb-textarea { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.2); }
        .nb-text-container.done-pane .nb-textarea:focus { border-color: #a6e3a1; }
        .nb-text-container.remaining-pane .nb-textarea { color: #f38ba8; border-color: rgba(243, 139, 168, 0.2); }
        .nb-text-container.remaining-pane .nb-textarea:focus { border-color: #f38ba8; }

        .history-card { background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 10px; margin-bottom: 8px; color: #cdd6f4; font-size: 0.85rem; position: relative; }
        .card-main-line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222538; padding-bottom: 4px; margin-bottom: 4px; }
        .card-subject { font-weight: bold; color: #fff; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
        .card-duration { font-weight: bold; color: var(--current-theme); }
        .card-desc { color: #a6adc8; font-size: 0.8rem; margin: 4px 0; background: #11111b; padding: 4px 6px; border-radius: 4px; text-align: right; direction: rtl; word-wrap: break-word; }
        .card-bottom-info { font-size: 0.75rem; color: #7f849c; display: flex; justify-content: space-between; margin-top: 6px; }

        /* Schedule Card Styling */
        .schedule-card { background: #181825; border: 1px solid #313244; border-right: 4px solid var(--schedule-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; color: #cdd6f4; font-size: 0.85rem; text-align: right; direction: rtl; position: relative;}
        .schedule-card .sch-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #28283d; padding-bottom: 6px; margin-bottom: 6px; }
        .schedule-card .sch-subject { font-size: 1rem; font-weight: bold; color: var(--schedule-color); }
        .schedule-card .sch-teacher { color: #a6e3a1; font-weight: bold; font-size: 0.85rem; }
        .schedule-card .sch-body { display: flex; flex-direction: column; gap: 4px; color: #bac2de; font-size: 0.8rem; }
        .schedule-card .sch-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; border-top: 1px solid #28283d; padding-top: 6px; }
        .btn-sch-action { padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; border: 1px solid #313244; background: #11111b; }
        .btn-sch-edit { color: #89b4fa; border-color: #89b4fa; }
        .btn-sch-del { color: #f38ba8; border-color: #f38ba8; }
        .btn-sch-restore { color: #a6e3a1; border-color: #a6e3a1; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1e1e2e; border: 2px solid var(--current-theme); padding: 20px; border-radius: 12px; width: 320px; text-align: right; direction: rtl; color: #cdd6f4; }
        .modal-content h3 { margin-top: 0; color: var(--current-theme); text-align: center; font-size: 1.1rem;}
        .modal-content label { display: block; margin: 8px 0 4px; font-size: 0.85rem;}
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 8px; background: #11111b; border: 1px solid #313244; border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; font-family: inherit;}
        .modal-content textarea { resize: none; height: 60px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; justify-content: center;}
        .modal-actions button { padding: 6px 16px; font-size: 0.85rem;}

        /* Modern Auth Modal UI */
        .auth-card {
            background: #181825;
            border: 1px solid #313244;
            border-radius: 20px;
            width: 360px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            direction: rtl;
            position: relative;
        }
        .auth-header { text-align: center; }
        .auth-header h2 { margin: 0; font-size: 1.4rem; color: #fff; font-weight: 700; }
        .auth-header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #a6adc8; }
        .auth-tabs { display: flex; background: #11111b; padding: 4px; border-radius: 10px; border: 1px solid #313244; }
        .auth-tab-btn { flex: 1; padding: 8px; background: transparent; border: none; color: #a6adc8; font-size: 0.85rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .auth-tab-btn.active { background: var(--current-theme); color: #11111b; font-weight: bold; }
        .auth-input-group { display: flex; flex-direction: column; gap: 6px; }
        .auth-input-group label { font-size: 0.8rem; color: #cdd6f4; font-weight: 600; }
        .auth-input-group input { background: #11111b; border: 1px solid #313244; padding: 10px 12px; border-radius: 10px; color: #fff; outline: none; direction: ltr; font-size: 0.9rem; transition: 0.3s; }
        .auth-input-group input:focus { border-color: var(--current-theme); box-shadow: 0 0 8px rgba(166, 227, 161, 0.2); }
        .auth-submit-btn { background: var(--current-theme); color: #11111b; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .auth-submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-google-btn { background: #4285F4; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .auth-google-btn:hover { background: #3367d6; }
        .auth-logout-btn { background: rgba(243, 139, 168, 0.1); border: 1px solid #f38ba8; color: #f38ba8; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .auth-logout-btn:hover { background: #f38ba8; color: #11111b; }
        .close-auth-card { position: absolute; top: 15px; left: 15px; background: none; border: none; color: #6c7086; font-size: 1.2rem; cursor: pointer; }
        .close-auth-card:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="cairoWidget" class="cairo-live-widget">
        <div id="cairoClock" class="widget-clock">جاري الحساب...</div>
        <div id="cairoDate">جاري الحساب...</div>
    </div>

    <!-- Auth Status Trigger -->
    <div class="auth-status-bar">
        <button id="authModalBtn" class="auth-btn-trigger" onclick="openAuthModal()">
            <span>👤</span> <span id="authBtnLabel">تسجيل الدخول / حساب جديد</span>
        </button>
    </div>

    <!-- زر القائمة -->
    <button class="menu-toggle-btn" onclick="toggleTopMenu()">☰</button>

    <div id="topBarNav" class="top-bar">
        <button class="btn-notebook-trigger" onclick="openNotebook(); toggleTopMenu();">Notebook 📓</button>
        <button onclick="openUnifiedHistory('study'); toggleTopMenu();">History 📜</button>
        <button style="border-color: var(--schedule-color); color: var(--schedule-color);" onclick="openScheduleView(); toggleTopMenu();">Schedule 🗓️</button>
        <button style="border-color:#f38ba8; color:#f38ba8;" onclick="openTrash(); toggleTopMenu();">Trash / Recovery 🗑️</button>
    </div>

    <div id="mainContainer">
        <div id="appTitle" class="brand-title">Study System</div>

        <div id="mainApp">
            <div id="container-study" class="timer-box active">
                <div id="display-study" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button id="saveBtnStudy" onclick="saveSessionPrompt()">Save</button>
                    <button id="resetBtnStudy" onclick="endTimer()">Reset</button>
                    <button id="miniBtnStudy" onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-break" class="timer-box">
                <div id="display-break" class="timer-display">05:00</div>
                <div class="break-input-group">
                    <div class="input-field"><label>Hours</label><input type="number" id="breakHoursInput" value="0" min="0" max="24" onchange="setBreakDuration()"></div>
                    <div class="input-field"><label>Minutes</label><input type="number" id="breakMinutesInput" value="5" min="0" max="59" onchange="setBreakDuration()"></div>
                </div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-quiz" class="timer-box">
                <div id="display-quiz" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-afk" class="timer-box">
                <div id="display-afk" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="bottomModeSelectors" class="controls" style="margin-top: 35px; border-top: 1px solid #181825; padding-top: 20px;">
                <button id="btn-study" class="mode-btn" onclick="switchMode('study')">Study Mode 📚</button>
                <button id="btn-break" class="mode-btn" onclick="switchMode('break')">Break Mode ☕</button>
                <button id="btn-quiz" class="mode-btn" onclick="switchMode('quiz')">Quiz Timer 📝</button>
                <button id="btn-afk" class="mode-btn" onclick="switchMode('afk')">AFK Timer ⏳</button>
            </div>
        </div>
    </div>

    <!-- واجهة المفكرة -->
    <div id="notebookSidebar" class="notebook-sidebar">
        <div class="nb-header">
            <button class="close-nb-btn" style="color: #f38ba8;" onclick="closeNotebook()">✕</button>

    <!-- Firebase SDK Modules Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ قم باستبدال الكائن الأدناه بـ Firebase Config الخاص بك من لوحة Firebase Console
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global User Reference
        window.fbUser = null;

        // Sync Listener for Auth State
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.fbUser = user;
                window.currentUser = user.email;
                await loadCloudData();
            } else {
                window.fbUser = null;
                window.currentUser = null;
                window.loadUserData();
            }
            window.updateAuthStatusUI();
        });

        // Email & Password Auth Handlers
        window.handleAuthSubmit = async function() {
            const email = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errorEl = document.getElementById('authErrorMsg');

            if (!email || !password) {
                errorEl.innerText = 'يرجى إدخال البريد الإلكتروني وكلمة السر!';
                errorEl.style.display = 'block';
                return;
            }

            try {
                if (window.authMode === 'register') {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                window.closeModal('authModal');
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.style.display = 'block';
            }
        };

        // Google Sign-In Handler
        window.handleGoogleSignIn = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.closeModal('authModal');
            } catch (err) {
                const errorEl = document.getElementById('authErrorMsg');
                errorEl.innerText = err.message;
                errorEl.style.display = 'block';
            }
        };

        // Logout Handler
        window.handleLogout = async function() {
            await signOut(auth);
            window.closeModal('authModal');
        };

        // Cloud Firestore Synchronization Methods
        window.saveCloudData = async function() {
            if (!window.fbUser) {
                window.saveUserData();
                return;
            }
            try {
                const userRef = doc(db, "users", window.fbUser.uid);
                await setDoc(userRef, {
                    history: window.userHistory,
                    schedule: window.userSchedule,
                    trash: window.userTrash,
                    notebook: JSON.parse(localStorage.getItem('temp_notebook_cache') || '{}')
                }, { merge: true });
            } catch (e) {
                console.error("Cloud Save Error: ", e);
            }
        };

        window.loadCloudData = async function() {
            if (!window.fbUser) return;
            try {
                const userRef = doc(db, "users", window.fbUser.uid);
                const docSnap = await getDoc(userRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.userHistory = data.history || [];
                    window.userSchedule = data.schedule || [];
                    window.userTrash = data.trash || [];
                    
                    if (data.notebook) {
                        document.getElementById('note-arabic-done').value = data.notebook.arabic_done || '';
                        document.getElementById('note-arabic-rem').value = data.notebook.arabic_rem || '';
                        document.getElementById('note-english-done').value = data.notebook.english_done || '';
                        document.getElementById('note-english-rem').value = data.notebook.english_rem || '';
                        document.getElementById('note-history-done').value = data.notebook.history_done || '';
                        document.getElementById('note-history-rem').value = data.notebook.history_rem || '';
                        document.getElementById('note-physics-done').value = data.notebook.physics_done || '';
                        document.getElementById('note-physics-rem').value = data.notebook.physics_rem || '';
                    }
                } else {
                    window.userHistory = [];
                    window.userSchedule = [];
                    window.userTrash = [];
                }
            } catch (e) {
                console.error("Cloud Load Error: ", e);
            }
        };
    </script>

    <!-- JS Logic Code Implementation -->
    <script>
        // State Management & LocalStorage
        let currentUser = localStorage.getItem('study_system_logged_user') || null;
        let authMode = 'login'; // 'login' or 'register'
        let currentTimerMode = 'study'; // study, break, quiz, afk
        let activeHistorySubTab = 'study';
        
        let timerInterval = null;
        let secondsElapsed = 0;
        let isRunning = false;

        // Data Models
        let userHistory = [];
        let userSchedule = [];
        let userTrash = [];

        // Dynamic Storage Key Helpers
        function getStorageKey(key) {
            return currentUser ? `user_${currentUser}_${key}` : `guest_${key}`;
        }

        function loadUserData() {
            userHistory = JSON.parse(localStorage.getItem(getStorageKey('history')) || '[]');
            userSchedule = JSON.parse(localStorage.getItem(getStorageKey('schedule')) || '[]');
            userTrash = JSON.parse(localStorage.getItem(getStorageKey('trash')) || '[]');
            loadNotebookData();
            updateAuthStatusUI();
        }

        function saveUserData() {
            localStorage.setItem(getStorageKey('history'), JSON.stringify(userHistory));
            localStorage.setItem(getStorageKey('schedule'), JSON.stringify(userSchedule));
            localStorage.setItem(getStorageKey('trash'), JSON.stringify(userTrash));
            if (window.saveCloudData) window.saveCloudData();
        }

        // Live Cairo Clock
        function updateCairoClock() {
            const now = new Date();
            const clockEl = document.getElementById('cairoClock');
            const dateEl = document.getElementById('cairoDate');
            if (clockEl && dateEl) {
                clockEl.innerText = now.toLocaleTimeString('ar-EG', { timeZone: 'Africa/Cairo' });
                dateEl.innerText = now.toLocaleDateString('ar-EG', { timeZone: 'Africa/Cairo', weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
            }
        }
        setInterval(updateCairoClock, 1000);
        updateCairoClock();

        // Auth Logic
        function openAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('authErrorMsg').style.display = 'none';
            if (currentUser) {
                document.getElementById('authTabs').style.display = 'none';
                document.getElementById('authFormArea').style.display = 'none';
                document.getElementById('userProfileArea').style.display = 'block';
                document.getElementById('loggedInUserName').innerText = currentUser;
                document.getElementById('authTitle').innerText = 'حسابي';
                document.getElementById('authSubtitle').innerText = 'أنت مسجل الدخول حالياً';
            } else {
                document.getElementById('authTabs').style.display = 'flex';
                document.getElementById('authFormArea').style.display = 'block';
                document.getElementById('userProfileArea').style.display = 'none';
                switchAuthTab(authMode);
            }
        }

        function switchAuthTab(mode) {
            authMode = mode;
            document.getElementById('authErrorMsg').style.display = 'none';
            if (mode === 'login') {
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('registerTabBtn').classList.remove('active');
                document.getElementById('authTitle').innerText = 'تسجيل الدخول';
                document.getElementById('authSubtitle').innerText = 'قم بتسجيل الدخول للحفاظ على بياناتك وسجلاتك عبر السحابة';
                document.getElementById('authSubmitBtn').innerText = 'دخول';
            } else {
                document.getElementById('registerTabBtn').classList.add('active');
                document.getElementById('loginTabBtn').classList.remove('active');
                document.getElementById('authTitle').innerText = 'إنشاء حساب جديد';
                document.getElementById('authSubtitle').innerText = 'أنشئ حساباً جديداً لحفظ بياناتك الخاصة';
                document.getElementById('authSubmitBtn').innerText = 'إنشاء حساب';
            }
        }

        function updateAuthStatusUI() {
            const label = document.getElementById('authBtnLabel');
            if (currentUser) {
                label.innerText = `أهلاً، ${currentUser}`;
            } else {
                label.innerText = 'تسجيل الدخول / حساب جديد';
            }
        }

        // Navigation & Modals
        function toggleTopMenu() {
            document.getElementById('topBarNav').classList.toggle('active');
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function switchMode(mode) {
            pauseTimer();
            currentTimerMode = mode;
            document.querySelectorAll('.timer-box').forEach(b => b.classList.remove('active'));
            document.getElementById(`container-${mode}`).classList.add('active');

            const root = document.documentElement;
            if (mode === 'study') root.style.setProperty('--current-theme', 'var(--study-color)');
            else if (mode === 'break') root.style.setProperty('--current-theme', 'var(--break-color)');
            else if (mode === 'quiz') root.style.setProperty('--current-theme', 'var(--quiz-color)');
            else if (mode === 'afk') root.style.setProperty('--current-theme', 'var(--afk-color)');
        }

        // Timer Functionality
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateDisplay();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function endTimer() {
            pauseTimer();
            secondsElapsed = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
            const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            
            const text = (hrs !== '00') ? `${hrs}:${mins}:${secs}` : `${mins}:${secs}`;
            const displayEl = document.getElementById(`display-${currentTimerMode}`);
            if (displayEl) displayEl.innerText = text;
        }

        function setBreakDuration() {
            const h = parseInt(document.getElementById('breakHoursInput').value) || 0;
            const m = parseInt(document.getElementById('breakMinutesInput').value) || 0;
            secondsElapsed = (h * 3600) + (m * 60);
            updateDisplay();
        }

        function saveSessionPrompt() {
            if (secondsElapsed === 0) {
                alert('لا يمكن حفظ جلسة مدتها صفر!');
                return;
            }
            pauseTimer();
            document.getElementById('modalSubjectInput').value = '';
            document.getElementById('modalDescInput').value = '';
            document.getElementById('saveModal').style.display = 'flex';
        }

        function confirmSaveSession() {
            const subject = document.getElementById('modalSubjectInput').value.trim() || 'بدون عنوان';
            const desc = document.getElementById('modalDescInput').value.trim() || '';
            
            const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
            const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            const durationText = (hrs !== '00') ? `${hrs}:${mins}:${secs}` : `${mins}:${secs}`;

            const entry = {
                id: Date.now(),
                mode: currentTimerMode,
                subject: subject,
                desc: desc,
                duration: durationText,
                date: new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})
            };

            userHistory.unshift(entry);
            saveUserData();
            closeModal('saveModal');
            endTimer();
            openUnifiedHistory(currentTimerMode);
        }

        function requestMini() {
            if ('pictureInPictureEnabled' in document) {
                alert('خاصية Mini Timer متوافقة مع المتصفحات التي تدعم PiP.');
            } else {
                alert('خاصية المصغر تعمل عبر شاشات مستقلة.');
            }
        }

        // Sidebar History & Views
        function openUnifiedHistory(mode = 'study') {
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('addSchBtn').style.display = 'none';
            document.getElementById('printHistoryBtn').style.display = 'inline-block';
            document.getElementById('historyTabsNav').style.display = 'flex';
            document.getElementById('sidebarTitle').innerText = 'History';
            switchHistorySubTab(mode);
        }

        function closeHistory() {
            document.getElementById('sidebarHistory').classList.remove('open');
            document.getElementById('mainContainer').classList.remove('sidebar-open');
        }

        function switchHistorySubTab(subTab) {
            activeHistorySubTab = subTab;
            document.querySelectorAll('.history-tab-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`htab-${subTab}`);
            if (btn) btn.classList.add('active');

            const content = document.getElementById('sidebarContent');
            content.innerHTML = '';

            const filtered = userHistory.filter(item => item.mode === subTab);
            if (filtered.length === 0) {
                content.innerHTML = '<div style="color:#6c7086; text-align:center; margin-top:20px;">لا يوجد سجلات لهذه الفئة</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="card-main-line">
                        <span class="card-subject">${item.subject}</span>
                        <span class="card-duration">${item.duration}</span>
                    </div>
                    ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
                    <div class="card-bottom-info">
                        <span>${item.date}</span>
                        <button style="background:none; border:none; color:#f38ba8; cursor:pointer; font-size:0.75rem;" onclick="deleteHistoryItem(${item.id})">حذف 🗑️</button>
                    </div>
                `;
                content.appendChild(card);
            });
        }

        function deleteHistoryItem(id) {
            const index = userHistory.findIndex(i => i.id === id);
            if (index !== -1) {
                const removed = userHistory.splice(index, 1)[0];
                userTrash.push({ ...removed, trashType: 'history' });
                saveUserData();
                switchHistorySubTab(activeHistorySubTab);
            }
        }

        // Schedule View
        function openScheduleView() {
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('addSchBtn').style.display = 'inline-block';
            document.getElementById('printHistoryBtn').style.display = 'none';
            document.getElementById('historyTabsNav').style.display = 'none';
            document.getElementById('sidebarTitle').innerText = 'Schedule';

            renderScheduleItems();
        }

        function renderScheduleItems() {
            const content = document.getElementById('sidebarContent');
            content.innerHTML = '';

            if (userSchedule.length === 0) {
                content.innerHTML = '<div style="color:#6c7086; text-align:center; margin-top:20px;">الجدول فارغ حالياً</div>';
                return;
            }

            userSchedule.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'schedule-card';
                card.innerHTML = `
                    <div class="sch-header">
                        <span class="sch-subject">${item.subject}</span>
                        <span class="sch-teacher">${item.teacher}</span>
                    </div>
                    <div class="sch-body">
                        <div><b>📌 العنوان:</b> ${item.title}</div>
                        <div><b>📅 الميعاد:</b> ${item.date} - ${item.time} (${item.place})</div>
                    </div>
                    <div class="sch-actions">
                        <button class="btn-sch-action btn-sch-edit" onclick="editScheduleItem(${index})">تعديل ✏️</button>
                        <button class="btn-sch-action btn-sch-del" onclick="deleteScheduleItem(${index})">حذف 🗑️</button>
                    </div>
                `;
                content.appendChild(card);
            });
        }

        function openAddScheduleModal() {
            document.getElementById('schEditIndex').value = "-1";
            document.getElementById('schSubjectInput').value = "";
            document.getElementById('schTeacherInput').value = "";
            document.getElementById('schTitleInput').value = "";
            document.getElementById('schDateInput').value = "";
            document.getElementById('schTimeInput').value = "";
            document.getElementById('schModalTitle').innerText = "إضافة حصة/درس للجدول";
            document.getElementById('scheduleModal').style.display = "flex";
        }

        function saveScheduleItem() {
            const idx = parseInt(document.getElementById('schEditIndex').value);
            const item = {
                subject: document.getElementById('schSubjectInput').value.trim() || 'مادة',
                teacher: document.getElementById('schTeacherInput').value.trim() || 'أستاذ',
                title: document.getElementById('schTitleInput').value.trim() || '',
                date: document.getElementById('schDateInput').value.trim() || '',
                time: document.getElementById('schTimeInput').value.trim() || '',
                place: document.getElementById('schPlaceInput').value
            };

            if (idx === -1) {
                userSchedule.push(item);
            } else {
                userSchedule[idx] = item;
            }

            saveUserData();
            closeModal('scheduleModal');
            renderScheduleItems();
        }

        function editScheduleItem(index) {
            const item = userSchedule[index];
            document.getElementById('schEditIndex').value = index;
            document.getElementById('schSubjectInput').value = item.subject;
            document.getElementById('schTeacherInput').value = item.teacher;
            document.getElementById('schTitleInput').value = item.title;
            document.getElementById('schDateInput').value = item.date;
            document.getElementById('schTimeInput').value = item.time;
            document.getElementById('schPlaceInput').value = item.place;
            document.getElementById('schModalTitle').innerText = "تعديل حِصة/درس";
            document.getElementById('scheduleModal').style.display = "flex";
        }

        function deleteScheduleItem(index) {
            const removed = userSchedule.splice(index, 1)[0];
            userTrash.push({ ...removed, trashType: 'schedule' });
            saveUserData();
            renderScheduleItems();
        }

        // Trash & Recovery
        function openTrash() {
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('addSchBtn').style.display = 'none';
            document.getElementById('printHistoryBtn').style.display = 'none';
            document.getElementById('historyTabsNav').style.display = 'none';
            document.getElementById('sidebarTitle').innerText = 'Trash / Recovery';

            const content = document.getElementById('sidebarContent');
            content.innerHTML = '';

            if (userTrash.length === 0) {
                content.innerHTML = '<div style="color:#6c7086; text-align:center; margin-top:20px;">المحذوفات فارغة</div>';
                return;
            }

            userTrash.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="card-main-line">
                        <span class="card-subject">${item.subject || item.title || 'عنصر محذوف'}</span>
                        <span class="card-duration">${item.trashType === 'history' ? 'سجل' : 'حصة'}</span>
                    </div>
                    <div class="card-bottom-info">
                        <button class="btn-sch-action btn-sch-restore" onclick="restoreTrashItem(${index})">استعادة 🔄</button>
                        <button class="btn-sch-action btn-sch-del" onclick="permanentlyDeleteTrash(${index})">حذف نهائي ❌</button>
                    </div>
                `;
                content.appendChild(card);
            });
        }

        function restoreTrashItem(index) {
            const item = userTrash.splice(index, 1)[0];
            if (item.trashType === 'history') {
                delete item.trashType;
                userHistory.unshift(item);
            } else {
                delete item.trashType;
                userSchedule.push(item);
            }
            saveUserData();
            openTrash();
        }

        function permanentlyDeleteTrash(index) {
            userTrash.splice(index, 1);
            saveUserData();
            openTrash();
        }

        // Notebook Logic
        function openNotebook() {
            document.getElementById('notebookSidebar').classList.add('open');
            document.getElementById('mainContainer').classList.add('notebook-open');
        }

        function closeNotebook() {
            document.getElementById('notebookSidebar').classList.remove('open');
            document.getElementById('mainContainer').classList.remove('notebook-open');
        }

        function switchNbPane(subject, pane) {
            const doneBtn = document.getElementById(`tab-${subject}-done`);
            const remBtn = document.getElementById(`tab-${subject}-rem`);
            const donePane = document.getElementById(`pane-${subject}-done`);
            const remPane = document.getElementById(`pane-${subject}-rem`);

            if (pane === 'done') {
                doneBtn.classList.add('active-tab');
                remBtn.classList.remove('active-tab');
                donePane.classList.add('active-pane');
                remPane.classList.remove('active-pane');
            } else {
                remBtn.classList.add('active-tab');
                doneBtn.classList.remove('active-tab');
                remPane.classList.add('active-pane');
                donePane.classList.remove('active-pane');
            }
        }

        function saveNotebookData() {
            const data = {
                arabic_done: document.getElementById('note-arabic-done').value,
                arabic_rem: document.getElementById('note-arabic-rem').value,
                english_done: document.getElementById('note-english-done').value,
                english_rem: document.getElementById('note-english-rem').value,
                history_done: document.getElementById('note-history-done').value,
                history_rem: document.getElementById('note-history-rem').value,
                physics_done: document.getElementById('note-physics-done').value,
                physics_rem: document.getElementById('note-physics-rem').value
            };
            localStorage.setItem(getStorageKey('notebook'), JSON.stringify(data));
            localStorage.setItem('temp_notebook_cache', JSON.stringify(data));
            if (window.saveCloudData) window.saveCloudData();
        }

        function loadNotebookData() {
            const data = JSON.parse(localStorage.getItem(getStorageKey('notebook')) || '{}');
            document.getElementById('note-arabic-done').value = data.arabic_done || '';
            document.getElementById('note-arabic-rem').value = data.arabic_rem || '';
            document.getElementById('note-english-done').value = data.english_done || '';
            document.getElementById('note-english-rem').value = data.english_rem || '';
            document.getElementById('note-history-done').value = data.history_done || '';
            document.getElementById('note-history-rem').value = data.history_rem || '';
            document.getElementById('note-physics-done').value = data.physics_done || '';
            document.getElementById('note-physics-rem').value = data.physics_rem || '';
        }

        function printNotebook() {
            window.print();
        }

        function printFullHistory() {
            window.print();
        }

        // Initialize on load
        window.onload = function() {
            loadUserData();
        };
    </script>
</body>
</html>
