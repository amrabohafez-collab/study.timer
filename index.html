<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Timer</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/KxRJyWnp/st-photo-png.png">
    
    <style id="dynamicStyle">
        :root {
            --study-color: #a6e3a1;
            --break-color: #cba6f7;
            --social-color: #89b4fa;
            --quiz-color: #89b4fa;
            --afk-color: #f9e2af;
            --clock-color: #a6adc8; 
            --exam-color: #89b4fa;
            --schedule-color: #f5e0dc;
            --current-theme: var(--study-color);
            
            --arabic-color: #89b4fa;
            --english-color: #a6e3a1;
            --history-color: #f9e2af;
            --physics-color: #f38ba8;
        }

        body { 
            background: #0f0f16; 
            color: var(--current-theme); 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            transition: background 0.5s, color 0.5s;
        }

        .cairo-live-widget {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #181825;
            border: 1px solid #313244;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #6c7086; 
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: left;
            transition: opacity 0.3s ease;
        }
        .cairo-live-widget .widget-clock {
            color: var(--clock-color);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            direction: rtl;
        }

        /* Modern Auth Header Trigger Bar */
        .auth-status-bar {
            position: absolute;
            top: 20px;
            left: 210px;
            z-index: 15;
        }
        .auth-btn-trigger {
            background: rgba(24, 24, 37, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cdd6f4;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-btn-trigger:hover {
            border-color: var(--current-theme);
            color: var(--current-theme);
            box-shadow: 0 0 12px var(--current-theme);
            transform: translateY(-1px);
        }

        .brand-title { font-size: 2.5rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 30px; color: var(--current-theme); transition: opacity 0.3s ease; }
        
        .exam-countdown-container {
            position: absolute;
            bottom: 45px;
            text-align: center;
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 5;
        }

        .exam-countdown-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--exam-color);
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(137, 180, 250, 0.3);
            font-family: 'Segoe UI', sans-serif;
        }

        .exam-countdown-sub {
            font-size: 0.75rem;
            color: #a6adc8;
            letter-spacing: 1.5px;
            font-weight: 500;
            font-family: monospace, 'Segoe UI', sans-serif;
        }

        .footer-credits { position: absolute; bottom: 15px; font-size: 0.85rem; color: #585b70; letter-spacing: 0.5px; }

        #mainContainer { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; transition: all 0.3s ease; }
        #mainContainer.sidebar-open { padding-right: 380px; }
        #mainContainer.notebook-open { padding-left: 50vw; } 
        
        #mainApp { text-align: center; width: 100%; max-width: 600px; transition: all 0.3s ease; }
        .timer-box { display: none; }
        .timer-box.active { display: block; }
        .timer-display { font-size: 6rem; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,255,0.1); margin-bottom: 10px; }
        
        .break-input-group { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .break-input-group .input-field { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .break-input-group label { font-size: 0.85rem; opacity: 0.8; color: #cdd6f4;}
        .break-input-group input { background: #181825; border: 1px solid #313244; padding: 8px 12px; border-radius: 8px; color: #cdd6f4; width: 60px; text-align: center; font-size: 1rem; }

        .menu-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e1e2e;
            border: 1px solid #313244;
            color: #cdd6f4;
            padding: 10px 14px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            z-index: 110;
            transition: 0.3s;
        }
        .menu-toggle-btn:hover {
            background: var(--current-theme);
            color: #11111b;
        }

        .top-bar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 260px;
            height: 100%;
            background: #11111b;
            border-left: 2px solid #313244;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 80px 20px 20px 20px;
            z-index: 105;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .top-bar.active { right: 0; }
        .top-bar button {
            background: #1e1e2e;
            border: 1px solid #313244;
            color: #cdd6f4;
            padding: 10px 16px;
            font-size: 0.85rem;
            text-align: right;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .top-bar button:hover { background: #181825; border-color: var(--current-theme); }
        
        .btn-notebook-trigger { border-color: #cba6f7 !important; color: #cba6f7 !important; font-weight: bold; }
        .btn-notebook-trigger:hover { background: #cba6f7 !important; color: #11111b !important; }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; transition: opacity 0.3s ease; }
        
        button { padding: 12px 25px; cursor: pointer; border-radius: 25px; border: 1px solid var(--current-theme); background: #1e1e2e; color: var(--current-theme); font-weight: bold; transition: 0.3s; font-family: inherit; }
        button:hover { background: var(--current-theme); color: #11111b; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .mode-btn { background: #11111b; font-size: 0.9rem; }
        #btn-study { border-color: var(--study-color); color: var(--study-color); }
        #btn-break { border-color: var(--break-color); color: var(--break-color); }
        #btn-quiz { border-color: var(--quiz-color); color: var(--quiz-color); }
        #btn-afk { border-color: var(--afk-color); color: var(--afk-color); }

        .sidebar { position: fixed; right: -400px; top: 0; width: 360px; height: 100%; background: #11111b; border-left: 2px solid var(--current-theme); box-shadow: -5px 0 25px rgba(0,0,0,0.5); transition: right 0.3s ease; z-index: 100; display: flex; flex-direction: column; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--current-theme); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-header-share { background: #313244; border: 1px solid var(--current-theme); color: #fff; padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; }
        .btn-header-share:hover { background: var(--current-theme); color: #11111b; }
        .close-sidebar-btn { background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; }

        .sidebar-content { padding: 12px; flex-grow: 1; overflow-y: scroll; }
        .sidebar-content::-webkit-scrollbar { width: 14px; }
        .sidebar-content::-webkit-scrollbar-track { background: #181825; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--current-theme); border-radius: 7px; border: 2px solid #11111b; }

        /* History Nav Subtabs */
        .history-tabs-nav { display: flex; gap: 6px; margin-bottom: 12px; background: #181825; padding: 4px; border-radius: 8px; border: 1px solid #313244; }
        .history-tab-btn { flex: 1; padding: 6px; font-size: 0.75rem; font-weight: bold; border: none; background: transparent; color: #a6adc8; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .history-tab-btn.active { background: var(--current-theme); color: #11111b; }

        .notebook-sidebar { position: fixed; left: -55vw; top: 0; width: 50vw; height: 100%; background: #11111b; box-shadow: 5px 0 25px rgba(0,0,0,0.5); transition: left 0.3s ease; z-index: 150; display: flex; flex-direction: column; border-right: 2px solid #cba6f7; }
        .notebook-sidebar.open { left: 0; }
        
        .nb-header { padding: 15px 20px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
        .nb-header-right { display: flex; align-items: center; gap: 15px; }
        .nb-title { margin: 0; font-size: 1.4rem; font-weight: bold; }
        .close-nb-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        .nb-content { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; }
        .nb-content::-webkit-scrollbar { width: 8px; }
        .nb-content::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }

        .subject-block { background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; transition: 0.2s; }
        .subject-block.arabic { border-top: 4px solid var(--arabic-color); }
        .subject-block.english { border-top: 4px solid var(--english-color); }
        .subject-block.history { border-top: 4px solid var(--history-color); }
        .subject-block.physics { border-top: 4px solid var(--physics-color); }
        
        .sub-block-title { font-size: 1.15rem; font-weight: bold; text-align: right; margin: 0; direction: rtl; }
        .subject-block.arabic .sub-block-title { color: var(--arabic-color); }
        .subject-block.english .sub-block-title { color: var(--english-color); }
        .subject-block.history .sub-block-title { color: var(--history-color); }
        .subject-block.physics .sub-block-title { color: var(--physics-color); }

        .nb-tabs-row { display: flex; gap: 10px; width: 100%; direction: rtl; }
        .nb-tab-btn { flex: 1; padding: 8px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; border: 1px solid #313244; background: #11111b; cursor: pointer; transition: 0.2s; }
        .nb-tab-btn.btn-done-tab { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.3); }
        .nb-tab-btn.btn-done-tab.active-tab { background: rgba(166, 227, 161, 0.15); border-color: #a6e3a1; }
        .nb-tab-btn.btn-remaining-tab { color: #f38ba8; border-color: rgba(243, 139, 168, 0.3); }
        .nb-tab-btn.btn-remaining-tab.active-tab { background: rgba(243, 139, 168, 0.15); border-color: #f38ba8; }

        .nb-text-container { width: 100%; display: none; direction: rtl; }
        .nb-text-container.active-pane { display: block; }
        
        .nb-textarea { width: 100%; height: 110px; background: #11111b; border: 1px solid #313244; border-radius: 8px; padding: 10px; box-sizing: border-box; resize: none; font-family: inherit; font-size: 0.95rem; line-height: 1.5; outline: none; transition: border-color 0.2s; text-align: right; }
        
        .nb-text-container.done-pane .nb-textarea { color: #a6e3a1; border-color: rgba(166, 227, 161, 0.2); }
        .nb-text-container.done-pane .nb-textarea:focus { border-color: #a6e3a1; }
        .nb-text-container.remaining-pane .nb-textarea { color: #f38ba8; border-color: rgba(243, 139, 168, 0.2); }
        .nb-text-container.remaining-pane .nb-textarea:focus { border-color: #f38ba8; }

        .history-card { background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 10px; margin-bottom: 8px; color: #cdd6f4; font-size: 0.85rem; position: relative; }
        .card-main-line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222538; padding-bottom: 4px; margin-bottom: 4px; }
        .card-subject { font-weight: bold; color: #fff; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
        .card-duration { font-weight: bold; color: var(--current-theme); }
        .card-desc { color: #a6adc8; font-size: 0.8rem; margin: 4px 0; background: #11111b; padding: 4px 6px; border-radius: 4px; text-align: right; direction: rtl; word-wrap: break-word; }
        .card-bottom-info { font-size: 0.75rem; color: #7f849c; display: flex; justify-content: space-between; margin-top: 6px; }

        /* Schedule Card Styling */
        .schedule-card { background: #181825; border: 1px solid #313244; border-right: 4px solid var(--schedule-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; color: #cdd6f4; font-size: 0.85rem; text-align: right; direction: rtl; position: relative;}
        .schedule-card .sch-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #28283d; padding-bottom: 6px; margin-bottom: 6px; }
        .schedule-card .sch-subject { font-size: 1rem; font-weight: bold; color: var(--schedule-color); }
        .schedule-card .sch-teacher { color: #a6e3a1; font-weight: bold; font-size: 0.85rem; }
        .schedule-card .sch-body { display: flex; flex-direction: column; gap: 4px; color: #bac2de; font-size: 0.8rem; }
        .schedule-card .sch-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; border-top: 1px solid #28283d; padding-top: 6px; }
        .btn-sch-action { padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; border: 1px solid #313244; background: #11111b; }
        .btn-sch-edit { color: #89b4fa; border-color: #89b4fa; }
        .btn-sch-del { color: #f38ba8; border-color: #f38ba8; }
        .btn-sch-restore { color: #a6e3a1; border-color: #a6e3a1; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1e1e2e; border: 2px solid var(--current-theme); padding: 20px; border-radius: 12px; width: 320px; text-align: right; direction: rtl; color: #cdd6f4; }
        .modal-content h3 { margin-top: 0; color: var(--current-theme); text-align: center; font-size: 1.1rem;}
        .modal-content label { display: block; margin: 8px 0 4px; font-size: 0.85rem;}
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 8px; background: #11111b; border: 1px solid #313244; border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; font-family: inherit;}
        .modal-content textarea { resize: none; height: 60px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; justify-content: center;}
        .modal-actions button { padding: 6px 16px; font-size: 0.85rem;}

        /* Modern Auth Modal UI */
        .auth-card {
            background: #181825;
            border: 1px solid #313244;
            border-radius: 20px;
            width: 360px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            direction: rtl;
            position: relative;
        }
        .auth-header { text-align: center; }
        .auth-header h2 { margin: 0; font-size: 1.4rem; color: #fff; font-weight: 700; }
        .auth-header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #a6adc8; }
        .auth-tabs { display: flex; background: #11111b; padding: 4px; border-radius: 10px; border: 1px solid #313244; }
        .auth-tab-btn { flex: 1; padding: 8px; background: transparent; border: none; color: #a6adc8; font-size: 0.85rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .auth-tab-btn.active { background: var(--current-theme); color: #11111b; font-weight: bold; }
        .auth-input-group { display: flex; flex-direction: column; gap: 6px; }
        .auth-input-group label { font-size: 0.8rem; color: #cdd6f4; font-weight: 600; }
        .auth-input-group input { background: #11111b; border: 1px solid #313244; padding: 10px 12px; border-radius: 10px; color: #fff; outline: none; direction: ltr; font-size: 0.9rem; transition: 0.3s; }
        .auth-input-group input:focus { border-color: var(--current-theme); box-shadow: 0 0 8px rgba(166, 227, 161, 0.2); }
        .auth-submit-btn { background: var(--current-theme); color: #11111b; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .auth-submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-google-btn { background: #4285F4; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .auth-google-btn:hover { background: #3367d6; }
        .auth-logout-btn { background: rgba(243, 139, 168, 0.1); border: 1px solid #f38ba8; color: #f38ba8; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .auth-logout-btn:hover { background: #f38ba8; color: #11111b; }
        .close-auth-card { position: absolute; top: 15px; left: 15px; background: none; border: none; color: #6c7086; font-size: 1.2rem; cursor: pointer; }
        .close-auth-card:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="cairoWidget" class="cairo-live-widget">
        <div id="cairoClock" class="widget-clock">جاري الحساب...</div>
        <div id="cairoDate">جاري الحساب...</div>
    </div>

    <!-- Auth Status Trigger -->
    <div class="auth-status-bar" style="display:none;">
        <button id="authModalBtn" class="auth-btn-trigger">
            <span>👤</span> <span id="authBtnLabel">تسجيل الدخول / حساب جديد</span>
        </button>
    </div>

    <!-- زر القائمة -->
    <button class="menu-toggle-btn" onclick="toggleTopMenu()">☰</button>

    <div id="topBarNav" class="top-bar">
        <button class="btn-notebook-trigger" onclick="openNotebook(); toggleTopMenu();">Notebook 📓</button>
        <button onclick="openUnifiedHistory('study'); toggleTopMenu();">History 📜</button>
        <button style="border-color: var(--schedule-color); color: var(--schedule-color);" onclick="openScheduleView(); toggleTopMenu();">Schedule 🗓️</button>
        <button style="border-color:#f38ba8; color:#f38ba8;" onclick="openTrash(); toggleTopMenu();">Trash / Recovery 🗑️</button>
    </div>

    <div id="mainContainer">
        <div id="appTitle" class="brand-title">Study System</div>

        <div id="mainApp">
            <div id="container-study" class="timer-box active">
                <div id="display-study" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button id="saveBtnStudy" onclick="saveSessionPrompt()">Save</button>
                    <button id="resetBtnStudy" onclick="endTimer()">Reset</button>
                    <button id="miniBtnStudy" onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-break" class="timer-box">
                <div id="display-break" class="timer-display">05:00</div>
                <div class="break-input-group">
                    <div class="input-field"><label>Hours</label><input type="number" id="breakHoursInput" value="0" min="0" max="24" onchange="setBreakDuration()"></div>
                    <div class="input-field"><label>Minutes</label><input type="number" id="breakMinutesInput" value="5" min="0" max="59" onchange="setBreakDuration()"></div>
                </div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-quiz" class="timer-box">
                <div id="display-quiz" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="container-afk" class="timer-box">
                <div id="display-afk" class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="saveSessionPrompt()">Save</button>
                    <button onclick="endTimer()">Reset</button>
                    <button onclick="requestMini()">Mini</button>
                </div>
            </div>

            <div id="bottomModeSelectors" class="controls" style="margin-top: 35px; border-top: 1px solid #181825; padding-top: 20px;">
                <button id="btn-study" class="mode-btn" onclick="switchMode('study')">Study Mode 📚</button>
                <button id="btn-break" class="mode-btn" onclick="switchMode('break')">Break Mode ☕</button>
                <button id="btn-quiz" class="mode-btn" onclick="switchMode('quiz')">Quiz Timer 📝</button>
                <button id="btn-afk" class="mode-btn" onclick="switchMode('afk')">AFK Timer ⏳</button>
            </div>
        </div>
    </div>

    <!-- واجهة المفكرة -->
    <div id="notebookSidebar" class="notebook-sidebar">
        <div class="nb-header">
            <button class="close-nb-btn" style="color: #f38ba8;" onclick="closeNotebook()">✕</button>
            <div class="nb-header-right">
                <button class="btn-nb-share" style="background:#181825; border:1px solid #a6e3a1; color:#a6e3a1; padding:6px 14px; font-size:0.85rem; border-radius:20px; font-weight:bold;" onclick="printNotebook()">Share PDF 📄</button>
                <h2 class="nb-title" style="color: #cba6f7;">Notebook 📓</h2>
            </div>
        </div>
        <div class="nb-content">
            <div class="subject-block arabic">
                <p class="sub-block-title">1. اللغة العربية 📚</p>
                <div class="nb-tabs-row">
                    <button id="tab-arabic-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('arabic', 'done')">Done ✅</button>
                    <button id="tab-arabic-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('arabic', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-arabic-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-arabic-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-arabic-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-arabic-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
            <div class="subject-block english">
                <p class="sub-block-title">2. اللغة الإنجليزية 🇬🇧</p>
                <div class="nb-tabs-row">
                    <button id="tab-english-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('english', 'done')">Done ✅</button>
                    <button id="tab-english-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('english', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-english-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-english-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-english-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-english-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
            <div class="subject-block history">
                <p class="sub-block-title">3. التاريخ 🏛️</p>
                <div class="nb-tabs-row">
                    <button id="tab-history-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('history', 'done')">Done ✅</button>
                    <button id="tab-history-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('history', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-history-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-history-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-history-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-history-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
            <div class="subject-block physics">
                <p class="sub-block-title">4. الفيزياء ⚡</p>
                <div class="nb-tabs-row">
                    <button id="tab-physics-done" class="nb-tab-btn btn-done-tab active-tab" onclick="switchNbPane('physics', 'done')">Done ✅</button>
                    <button id="tab-physics-rem" class="nb-tab-btn btn-remaining-tab" onclick="switchNbPane('physics', 'rem')">Remaining ⏳</button>
                </div>
                <div id="pane-physics-done" class="nb-text-container done-pane active-pane">
                    <textarea id="note-physics-done" class="nb-textarea" placeholder="اكتب ما تم إنجازه..." oninput="saveNotebookData()"></textarea>
                </div>
                <div id="pane-physics-rem" class="nb-text-container remaining-pane">
                    <textarea id="note-physics-rem" class="nb-textarea" placeholder="اكتب المتبقي عليك..." oninput="saveNotebookData()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية للسجلات والجدول -->
    <div id="sidebarHistory" class="sidebar">
        <div class="sidebar-header">
            <button class="close-sidebar-btn" onclick="closeHistory()">✕</button>
            <div class="header-actions">
                <button id="addSchBtn" class="btn-header-share" style="display:none; border-color: var(--schedule-color); color: var(--schedule-color);" onclick="openAddScheduleModal()">+ إضافة حصة</button>
                <button id="printHistoryBtn" class="btn-header-share" onclick="printFullHistory()">Share PDF 📄</button>
                <h2 id="sidebarTitle">History</h2>
            </div>
        </div>

        <!-- History Inner Tabs Navigation -->
        <div id="historyTabsNav" class="history-tabs-nav" style="margin: 10px 12px 0 12px;">
            <button id="htab-study" class="history-tab-btn active" onclick="switchHistorySubTab('study')">Study 📚</button>
            <button id="htab-quiz" class="history-tab-btn" onclick="switchHistorySubTab('quiz')">Quiz 📝</button>
            <button id="htab-break" class="history-tab-btn" onclick="switchHistorySubTab('break')">Break ☕</button>
            <button id="htab-afk" class="history-tab-btn" onclick="switchHistorySubTab('afk')">AFK ⏳</button>
        </div>

        <div id="sidebarContent" class="sidebar-content"></div>
    </div>

    <!-- مودال الحفظ -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <h3 id="modalHeaderTitle">حفظ السجل الجديد</h3>
            <label>اسم المادة / النشاط:</label>
            <input type="text" id="modalSubjectInput" placeholder="مثال: لغة عربية (بلاغة)...">
            <label>وصف المذاكرة:</label>
            <textarea id="modalDescInput" placeholder="اكتب تفاصيل ما تم إنجازه هنا..."></textarea>
            <div class="modal-actions">
                <button onclick="confirmSaveSession()">حفظ السجل</button>
                <button style="color:#f38ba8; border-color:#f38ba8;" onclick="closeModal('saveModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- مودال الجدول Schedule Modal -->
    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <h3 id="schModalTitle">إضافة حصة/درس للجدول</h3>
            <input type="hidden" id="schEditIndex" value="-1">
            <label>اسم المادة:</label>
            <input type="text" id="schSubjectInput" placeholder="مثال: فيزياء">
            <label>اسم المستر:</label>
            <input type="text" id="schTeacherInput" placeholder="مثال: أ/ محمد">
            <label>العنوان / الفصل:</label>
            <input type="text" id="schTitleInput" placeholder="مثال: الباب الأول - التيار الكهربي">
            <label>اليوم والميعاد:</label>
            <input type="text" id="schDateInput" placeholder="مثال: الأحد والاربعاء">
            <label>الوقت:</label>
            <input type="text" id="schTimeInput" placeholder="مثال: 04:00 مساءً">
            <label>المكان:</label>
            <select id="schPlaceInput">
                <option value="سنتر">سنتر 🏫</option>
                <option value="منصة">منصة 💻</option>
            </select>
            <div class="modal-actions">
                <button onclick="saveScheduleItem()">حفظ</button>
                <button style="color:#f38ba8; border-color:#f38ba8;" onclick="closeModal('scheduleModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // System variables and states
        let currentMode = 'study';
        let timerInterval = null;
        let totalSeconds = 0;
        let isRunning = false;
        
        // Mode durations (in seconds, used mainly for countdown modes like break)
        let modeTimes = {
            study: 0,
            break: 300,
            quiz: 0,
            afk: 0
        };

        // Storage arrays
        let histories = { study: [], quiz: [], break: [], afk: [] };
        let scheduleItems = [];
        let trashItems = [];

        // Initialize App on load
        window.onload = function() {
            updateClockWidget();
            setInterval(updateClockWidget, 1000);
            loadLocalStorageData();
            updateDisplay();
        };

        function updateClockWidget() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
            hours = hours % 12;
            hours = hours ? hours : 12;
            let timeStr = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')} ${ampm}`;
            
            let options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            let dateStr = now.toLocaleDateString('ar-EG', options);
            
            document.getElementById('cairoClock').innerText = timeStr;
            document.getElementById('cairoDate').innerText = dateStr;
        }

        function switchMode(mode) {
            pauseTimer();
            currentMode = mode;
            
            // Update active timer boxes
            document.querySelectorAll('.timer-box').forEach(box => box.classList.remove('active'));
            document.getElementById(`container-${mode}`).classList.add('active');
            
            // Update root theme color variables
            let themeVar = `var(--${mode}-color)`;
            if(mode === 'quiz') themeVar = 'var(--quiz-color)';
            document.documentElement.style.setProperty('--current-theme', themeVar);
            
            // Update titles or specific mode inputs
            updateDisplay();
        }

        function formatTimeDisplay(seconds) {
            let hrs = Math.floor(seconds / 3600);
            let mins = Math.floor((seconds % 3600) / 60);
            let secs = seconds % 60;

            if (hrs > 0) {
                return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            } else {
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }

        function updateDisplay() {
            let displayElement = document.getElementById(`display-${currentMode}`);
            if (displayElement) {
                displayElement.innerText = formatTimeDisplay(totalSeconds);
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                if (currentMode === 'break' && modeTimes.break > 0) {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                    } else {
                        pauseTimer();
                        alert('انتهى وقت الراحة!');
                    }
                } else {
                    totalSeconds++;
                }
                updateDisplay();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function endTimer() {
            pauseTimer();
            if(currentMode === 'break') {
                totalSeconds = parseInt(document.getElementById('breakMinutesInput').value || 5) * 60;
            } else {
                totalSeconds = 0;
            }
            updateDisplay();
        }

        function setBreakDuration() {
            let hrs = parseInt(document.getElementById('breakHoursInput').value) || 0;
            let mins = parseInt(document.getElementById('breakMinutesInput').value) || 0;
            modeTimes.break = (hrs * 3600) + (mins * 60);
            totalSeconds = modeTimes.break;
            updateDisplay();
        }

        function toggleTopMenu() {
            document.getElementById('topBarNav').classList.toggle('active');
        }

        function saveSessionPrompt() {
            if(totalSeconds === 0) {
                alert('لا يوجد وقت مسجل للحفظ!');
                return;
            }
            document.getElementById('modalHeaderTitle').innerText = `حفظ جلسة (${currentMode.toUpperCase()})`;
            document.getElementById('modalSubjectInput').value = '';
            document.getElementById('modalDescInput').value = '';
            document.getElementById('saveModal').style.display = 'flex';
        }

        function confirmSaveSession() {
            let subj = document.getElementById('modalSubjectInput').value.trim() || 'جلسة بدون عنوان';
            let desc = document.getElementById('modalDescInput').value.trim();
            let durationStr = formatTimeDisplay(totalSeconds);
            
            let record = {
                id: Date.now(),
                subject: subj,
                duration: durationStr,
                description: desc,
                date: new Date().toLocaleDateString()
            };

            histories[currentMode].push(record);
            saveLocalStorageData();
            closeModal('saveModal');
            alert('تم حفظ الجلسة بنجاح في السجلات!');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function openUnifiedHistory(mode) {
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('addSchBtn').style.display = 'none';
            document.getElementById('historyTabsNav').style.display = 'flex';
            document.getElementById('sidebarTitle').innerText = 'History Records';
            switchHistorySubTab(mode);
        }

        function closeHistory() {
            document.getElementById('sidebarHistory').classList.remove('open');
            document.getElementById('mainContainer').classList.remove('sidebar-open');
        }

        function switchHistorySubTab(mode) {
            document.querySelectorAll('.history-tab-btn').forEach(btn => btn.classList.remove('active'));
            let activeBtn = document.getElementById(`htab-${mode}`);
            if(activeBtn) activeBtn.classList.add('active');

            let container = document.getElementById('sidebarContent');
            container.innerHTML = '';

            let records = histories[mode] || [];
            if(records.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#6c7086; margin-top:20px;">لا توجد سجلات بعد.</p>`;
                return;
            }

            records.slice().reverse().forEach(item => {
                let card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="card-main-line">
                        <span class="card-subject">${item.subject}</span>
                        <span class="card-duration">${item.duration}</span>
                    </div>
                    ${item.description ? `<div class="card-desc">${item.description}</div>` : ''}
                    <div class="card-bottom-info">
                        <span>${item.date}</span>
                        <span style="cursor:pointer; color:#f38ba8;" onclick="deleteHistoryRecord('${mode}', ${item.id})">حذف</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteHistoryRecord(mode, id) {
            histories[mode] = histories[mode].filter(item => item.id !== id);
            saveLocalStorageData();
            switchHistorySubTab(mode);
        }

        function openScheduleView() {
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('addSchBtn').style.display = 'block';
            document.getElementById('historyTabsNav').style.display = 'none';
            document.getElementById('sidebarTitle').innerText = 'Schedule List';
            
            let container = document.getElementById('sidebarContent');
            container.innerHTML = '';

            if(scheduleItems.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#6c7086; margin-top:20px;">الجدول فارغ تماماً.</p>`;
                return;
            }

            scheduleItems.forEach((sch, idx) => {
                let card = document.createElement('div');
                card.className = 'schedule-card';
                card.innerHTML = `
                    <div class="sch-header">
                        <span class="sch-subject">${sch.subject}</span>
                        <span class="sch-teacher">${sch.teacher}</span>
                    </div>
                    <div class="sch-body">
                        <div>العنوان: ${sch.title}</div>
                        <div>الميعاد: ${sch.date} (${sch.time})</div>
                        <div>المكان: ${sch.place}</div>
                    </div>
                    <div class="sch-actions">
                        <button class="btn-sch-action btn-sch-edit" onclick="editScheduleItem(${idx})">تعديل</button>
                        <button class="btn-sch-action btn-sch-del" onclick="deleteScheduleItem(${idx})">حذف</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openAddScheduleModal() {
            document.getElementById('schModalTitle').innerText = 'إضافة حصة/درس للجدول';
            document.getElementById('schEditIndex').value = -1;
            document.getElementById('schSubjectInput').value = '';
            document.getElementById('schTeacherInput').value = '';
            document.getElementById('schTitleInput').value = '';
            document.getElementById('schDateInput').value = '';
            document.getElementById('schTimeInput').value = '';
            document.getElementById('scheduleModal').style.display = 'flex';
        }

        function saveScheduleItem() {
            let idx = parseInt(document.getElementById('schEditIndex').value);
            let item = {
                subject: document.getElementById('schSubjectInput').value,
                teacher: document.getElementById('schTeacherInput').value,
                title: document.getElementById('schTitleInput').value,
                date: document.getElementById('schDateInput').value,
                time: document.getElementById('schTimeInput').value,
                place: document.getElementById('schPlaceInput').value
            };

            if(idx === -1) {
                scheduleItems.push(item);
            } else {
                scheduleItems[idx] = item;
            }
            saveLocalStorageData();
            closeModal('scheduleModal');
            openScheduleView();
        }

        function editScheduleItem(idx) {
            let sch = scheduleItems[idx];
            document.getElementById('schModalTitle').innerText = 'تعديل الحصة الدراسية';
            document.getElementById('schEditIndex').value = idx;
            document.getElementById('schSubjectInput').value = sch.subject;
            document.getElementById('schTeacherInput').value = sch.teacher;
            document.getElementById('schTitleInput').value = sch.title;
            document.getElementById('schDateInput').value = sch.date;
            document.getElementById('schTimeInput').value = sch.time;
            document.getElementById('schPlaceInput').value = sch.place;
            document.getElementById('scheduleModal').style.display = 'flex';
        }

        function deleteScheduleItem(idx) {
            let removed = scheduleItems.splice(idx, 1)[0];
            trashItems.push(removed);
            saveLocalStorageData();
            openScheduleView();
        }

        function openTrash() {
            document.getElementById('sidebarHistory').classList.add('open');
            document.getElementById('mainContainer').classList.add('sidebar-open');
            document.getElementById('addSchBtn').style.display = 'none';
            document.getElementById('historyTabsNav').style.display = 'none';
            document.getElementById('sidebarTitle').innerText = 'Trash / Recovery';

            let container = document.getElementById('sidebarContent');
            container.innerHTML = '';

            if(trashItems.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#6c7086; margin-top:20px;">سلة المحذوفات فارغة.</p>`;
                return;
            }

            trashItems.forEach((trh, idx) => {
                let card = document.createElement('div');
                card.className = 'schedule-card';
                card.innerHTML = `
                    <div class="sch-header">
                        <span class="sch-subject">${trh.subject || 'عنصر محذوف'}</span>
                    </div>
                    <div class="sch-body">
                        <div>التفاصيل: ${trh.title || trh.description || 'لا توجد تفاصيل'}</div>
                    </div>
                    <div class="sch-actions">
                        <button class="btn-sch-action btn-sch-restore" onclick="restoreTrashItem(${idx})">استرجاع</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function restoreTrashItem(idx) {
            let restored = trashItems.splice(idx, 1)[0];
            scheduleItems.push(restored);
            saveLocalStorageData();
            openTrash();
        }

        function openNotebook() {
            document.getElementById('notebookSidebar').classList.add('open');
            document.getElementById('mainContainer').classList.add('notebook-open');
        }

        function closeNotebook() {
            document.getElementById('notebookSidebar').classList.remove('open');
            document.getElementById('mainContainer').classList.remove('notebook-open');
        }

        function switchNbPane(subject, paneType) {
            document.getElementById(`tab-${subject}-done`).classList.remove('active-tab');
            document.getElementById(`tab-${subject}-rem`).classList.remove('active-tab');
            document.getElementById(`pane-${subject}-done`).classList.remove('active-pane');
            document.getElementById(`pane-${subject}-rem`).classList.remove('active-pane');

            document.getElementById(`tab-${subject}-${paneType === 'done' ? 'done' : 'rem'}`).classList.add('active-tab');
            document.getElementById(`pane-${subject}-${paneType === 'done' ? 'done' : 'rem'}`).classList.add('active-pane');
        }

        function saveNotebookData() {
            let data = {
                arabicDone: document.getElementById('note-arabic-done').value,
                arabicRem: document.getElementById('note-arabic-rem').value,
                englishDone: document.getElementById('note-english-done').value,
                englishRem: document.getElementById('note-english-rem').value,
                historyDone: document.getElementById('note-history-done').value,
                historyRem: document.getElementById('note-history-rem').value,
                physicsDone: document.getElementById('note-physics-done').value,
                physicsRem: document.getElementById('note-physics-rem').value
            };
            localStorage.setItem('study_notebook_data', JSON.stringify(data));
        }

        function loadLocalStorageData() {
            let savedHistories = localStorage.getItem('study_histories');
            if(savedHistories) {
                try { histories = JSON.parse(savedHistories); } catch(e){}
            }
            let savedSchedule = localStorage.getItem('study_schedule');
            if(savedSchedule) {
                try { scheduleItems = JSON.parse(savedSchedule); } catch(e){}
            }
            let savedTrash = localStorage.getItem('study_trash');
            if(savedTrash) {
                try { trashItems = JSON.parse(savedTrash); } catch(e){}
            }
            let savedNb = localStorage.getItem('study_notebook_data');
            if(savedNb) {
                try {
                    let d = JSON.parse(savedNb);
                    document.getElementById('note-arabic-done').value = d.arabicDone || '';
                    document.getElementById('note-arabic-rem').value = d.arabicRem || '';
                    document.getElementById('note-english-done').value = d.englishDone || '';
                    document.getElementById('note-english-rem').value = d.englishRem || '';
                    document.getElementById('note-history-done').value = d.historyDone || '';
                    document.getElementById('note-history-rem').value = d.historyRem || '';
                    document.getElementById('note-physics-done').value = d.physicsDone || '';
                    document.getElementById('note-physics-rem').value = d.physicsRem || '';
                } catch(e){}
            }
        }

        function saveLocalStorageData() {
            localStorage.setItem('study_histories', JSON.stringify(histories));
            localStorage.setItem('study_schedule', JSON.stringify(scheduleItems));
            localStorage.setItem('study_trash', JSON.stringify(trashItems));
        }

        function printNotebook() {
            window.print();
        }

        function printFullHistory() {
            window.print();
        }

        function requestMini() {
            alert('خاصية نافذة المصغرة غير مدعومة مباشرة في متصفحك الحالي، يمكنك تصغير نافذة المتصفح.');
        }
    </script>
